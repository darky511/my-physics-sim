<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закон Паскаля: 3D Симуляция</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        #ui-panel {
            background: rgba(40, 40, 40, 0.95);
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #444;
        }

        #ui-panel h2 {
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00d2ff;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background: #333;
            color: #fff;
            border: 2px solid #555;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #00d2ff;
            color: #111;
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        button#fire-btn {
            background: #ff3366;
            border-color: #ff3366;
        }

        button#fire-btn:hover {
            background: #ff5588;
            border-color: #ff5588;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
        }

        #simulation-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, #1a2634 0%, #0a0a0f 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Закон Паскаля 3D Симуляция</h2>
        <div class="controls">
            <button id="water-btn">Налить воду 💧</button>
            <button id="reset-btn">Сброс 🔄</button>
            <button id="fire-btn">ВЫСТРЕЛ 🔫</button>
        </div>
    </div>
<script>
    const container = document.getElementById('simulation-container');
    let scene, camera, renderer, controls;
    let flask, water, piston, gun;
    let waterStreams = [];
    let isFiring = false;

    function init() {
        scene = new THREE.Scene();

        // Берем точные размеры контейнера, когда он гарантированно отрисован
        const width = container.clientWidth || window.innerWidth;
        const height = container.clientHeight || (window.innerHeight - 90);

        camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 4, 12);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Освещение (сделали ярче, чтобы всё было видно)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00d2ff, 1.0);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        createPhysicsScene();

        window.addEventListener('resize', onWindowResize);

        document.getElementById('water-btn').onclick = () => fillWater();
        document.getElementById('reset-btn').onclick = () => resetSimulation();
        document.getElementById('fire-btn').onclick = () => fireShot();
    }

    function createPhysicsScene() {
        // Сетка пола
        const grid = new THREE.GridHelper(20, 20, 0x00d2ff, 0x333333);
        grid.position.y = -3;
        scene.add(grid);

        // --- ШАР ПАСКАЛЯ (Колба с отверстиями) ---
        flask = new THREE.Group();
        flask.position.set(0, 0, 0);
        scene.add(flask);

        // Стеклянное тело прибора
        const bodyGeo = new THREE.CylinderGeometry(1.5, 1.5, 4, 32, 1, true);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.25,
            transmission: 0.9,
            roughness: 0.1,
            side: THREE.DoubleSide
        });
        const bodyMesh = new THREE.Mesh(bodyGeo, glassMat);
        flask.add(bodyMesh);

        // Сферический наконечник снизу (где отверстия)
        const sphereGeo = new THREE.SphereGeometry(1.5, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
        const sphereMesh = new THREE.Mesh(sphereGeo, glassMat);
        sphereMesh.position.y = -2;
        flask.add(sphereMesh);

        // Отверстия в сфере для вылета струй
        const holeGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.1, 8);
        const holeMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        
        // Генерируем 6 отверстий по окружности сферы
        for(let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const hole = new THREE.Mesh(holeGeo, holeMat);
            hole.position.set(Math.cos(angle) * 1.45, -2.5, Math.sin(angle) * 1.45);
            hole.rotation.z = -angle - Math.PI/2;
            flask.add(hole);

            // Создаем скрытые заготовки для будущих водяных струй
            const streamGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 8);
            const streamMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, transparent: true, opacity: 0 });
            const stream = new THREE.Mesh(streamGeo, streamMat);
            // Смещаем центр геометрии, чтобы рос в длину
            streamGeo.translate(0, 0.05, 0);
            stream.position.copy(hole.position);
            stream.rotation.z = angle - Math.PI/2;
            scene.add(stream);
            waterStreams.push(stream);
        }

        // --- ПОРШЕНЬ ---
        const pistonGeo = new THREE.CylinderGeometry(1.45, 1.45, 0.4, 32);
        const pistonMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.8, roughness: 0.2 });
        piston = new THREE.Mesh(pistonGeo, pistonMat);
        piston.position.y = 1.8;
        flask.add(piston);

        // --- ВОДА (внутри колбы) ---
        const waterGeo = new THREE.CylinderGeometry(1.42, 1.42, 3.8, 32);
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, transparent: true, opacity: 0.0 });
        water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = -0.1;
        flask.add(water);

        // --- МОДЕЛЬ ПИСТОЛЕТА / РУКОЯТКИ ДАВЛЕНИЯ ---
        gun = new THREE.Group();
        gun.position.set(0, 3.5, 0); // Ставим прямо над поршнем
        flask.add(gun);

        // Рычаг/шток поршня
        const rodGeo = new THREE.CylinderGeometry(0.15, 0.15, 2, 16);
        const rod = new THREE.Mesh(rodGeo, pistonMat);
        rod.position.y = -0.5;
        gun.add(rod);

        // Рукоятка пистолетного типа
        const gripGeo = new THREE.BoxGeometry(0.4, 1.2, 0.6);
        const gripMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.5 });
        const grip = new THREE.Mesh(gripGeo, gripMat);
        grip.position.set(0, 0.6, 0);
        gun.add(grip);
        
        const triggerGeo = new THREE.BoxGeometry(0.3, 0.4, 0.2);
        const trigger = new THREE.Mesh(triggerGeo, holeMat);
        trigger.position.set(0, 0.4, 0.3);
        gun.add(trigger);
    }

    function onWindowResize() {
        const width = container.clientWidth;
        const height = container.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    }

    function fillWater() {
        water.material.opacity = 0.5;
        piston.position.y = 1.8;
        gun.position.y = 3.5;
    }

    function resetSimulation() {
        water.material.opacity = 0.0;
        piston.position.y = 1.8;
        gun.position.y = 3.5;
        isFiring = false;
        waterStreams.forEach(stream => {
            stream.scale.set(1, 1, 1);
            stream.material.opacity = 0;
        });
    }

    function fireShot() {
        if(water.material.opacity < 0.1) {
            alert("Сначала налей воду 💧!");
            return;
        }
        if(isFiring) return;
        isFiring = true;

        // Анимация укола/удара пистолета вниз
        let startTime = Date.now();
        function animateShot() {
            let elapsed = (Date.now() - startTime) / 300; // анимация длится 300мс
            if (elapsed > 1) elapsed = 1;

            // Движение поршня и пистолета вниз
            let drop = Math.sin(elapsed * Math.PI) * 0.6;
            piston.position.y = 1.8 - drop;
            gun.position.y = 3.5 - drop;

            // По закону Паскаля струи бьют во ВСЕ стороны одинаково!
            waterStreams.forEach(stream => {
                stream.material.opacity = 0.7 * Math.sin(elapsed * Math.PI);
                let length = drop * 8; // Длина струи зависит от силы нажатия
                stream.scale.set(1, length + 1, 1);
            });

            if (elapsed < 1) {
                requestAnimationFrame(animateShot);
            } else {
                isFiring = false;
            }
        }
        animateShot();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        renderer.render(scene, camera);
    }

    // Запускаем только после полной готовности DOM дерева
    window.onload = function() {
        init();
        animate();
        // Принудительный вызов ресайза для фиксации геометрии
        setTimeout(onWindowResize, 100);
    };
</script>
</body>
</html>

    <div id="simulation-container"></div>
