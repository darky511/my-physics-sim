<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закон Паскаля: 3D Симуляция</title>
    <style>
        /* Обнуляем отступы для полного экрана */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* Панель управления строго сверху */
        #ui-panel {
            background: rgba(20, 27, 45, 0.95);
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #1f293d;
        }

        #ui-panel h2 {
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Кнопки управления */
        button {
            background: #151d30;
            color: #fff;
            border: 2px solid #2c3a57;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #00d2ff;
            color: #0b0f19;
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        button#fire-btn {
            background: #ff3366;
            border-color: #ff3366;
        }

        button#fire-btn:hover {
            background: #ff5588;
            border-color: #ff5588;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        /* Главный контейнер симуляции по центру экрана */
        #simulation-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #16222f 0%, #070a12 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h2>Закон Паскаля 3D Симуляция</h2>
        <div class="controls">
            <button id="water-btn">Налить воду 💧</button>
            <button id="reset-btn">Сброс 🔄</button>
            <button id="fire-btn">ВЫСТРЕЛ 🔫</button>
        </div>
    </div>

    <div id="simulation-container">
        <!-- Холст Canvas будет создан динамически -->
    </div>
<script>
    const container = document.getElementById('simulation-container');
    let canvas, ctx;

    // Параметры 3D камеры и вращения
    let angleX = 0.4; // наклон сверху
    let angleY = 0.5; // поворот вокруг оси
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    // Состояния физики
    let waterLevel = 0;      // 0 - пусто, 1 - полная колба
    let targetWaterLevel = 0;
    let pistonY = -100;      // Координата Y поршня
    let shotProgress = 0;    // Прогресс выстрела и струй
    let isFiring = false;

    // Инициализация сцены
    function init() {
        canvas = document.createElement('canvas');
        container.appendChild(canvas);
        ctx = canvas.getContext('2d');

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Интерактив: вращение сцены мышкой во все стороны (псевдо-3D)
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            angleY += deltaX * 0.007;
            angleX = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, angleX + deltaY * 0.007));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Привязка кнопок
        document.getElementById('water-btn').onclick = () => { targetWaterLevel = 1; };
        document.getElementById('reset-btn').onclick = () => { targetWaterLevel = 0; isFiring = false; shotProgress = 0; };
        document.getElementById('fire-btn').onclick = () => {
            if (waterLevel < 0.2) { alert("Сначала налей воду 💧!"); return; }
            if (!isFiring) isFiring = true;
        };

        // Запуск бесконечного цикла отрисовки
        animate();
    }

    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }

    // Математическая функция проекции 3D точки (X, Y, Z) на 2D экран
    function project(x, y, z) {
        // Вращение по оси Y
        let cosY = Math.cos(angleY), sinY = Math.sin(angleY);
        let x1 = x * cosY - z * sinY;
        let z1 = x * sinY + z * cosY;

        // Вращение по оси X
        let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
        let y2 = y * cosX - z1 * sinX;
        let z2 = y * sinX + z1 * cosX;

        // Эффект перспективы и масштабирование под центр экрана
        const scale = 400 / (400 + z2); 
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 50;

        return {
            x: centerX + x1 * scale * 1.8,
            y: centerY - y2 * scale * 1.8,
            visible: z2 > -400
        };
    }

    // Рисование объемного 3D эллипса (сечения цилиндра)
    function draw3DCircle(y, radius, strokeColor, fillColor = null) {
        ctx.beginPath();
        const segments = 64;
        for (let i = 0; i <= segments; i++) {
            let angle = (i / segments) * Math.PI * 2;
            let px = Math.cos(angle) * radius;
            let pz = Math.sin(angle) * radius;
            let pt = project(px, y, pz);
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
        }
        ctx.closePath();
        if (fillColor) {
            ctx.fillStyle = fillColor;
            ctx.fill();
        }
        if (strokeColor) {
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    }

    // Отрисовка всей физической лаборатории
    function renderScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Рисуем сетку пола для ощущения глубины пространства
        ctx.strokeStyle = 'rgba(0, 210, 255, 0.07)';
        ctx.lineWidth = 1;
        for (let i = -5; i <= 5; i++) {
            ctx.beginPath();
            let p1 = project(i * 50, -180, -250);
            let p2 = project(i * 50, -180, 250);
            ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            ctx.beginPath();
            let p3 = project(-250, -180, i * 50);
            let p4 = project(250, -180, i * 50);
            ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
            ctx.stroke();
        }

        const radius = 60;
        const baseBotY = -120;
        const baseTopY = 120;

        // Расчет анимаций движения жидкостей и поршня
        waterLevel += (targetWaterLevel - waterLevel) * 0.1;
        let currentWaterY = baseBotY + (baseTopY - baseBotY) * 0.6 * waterLevel;

        if (isFiring) {
            shotProgress += 0.08;
            if (shotProgress > Math.PI) {
                shotProgress = 0;
                isFiring = false;
            }
        }
        let currentShotOffset = Math.sin(shotProgress) * 25;
        pistonY = (waterLevel > 0.1 ? currentWaterY : baseTopY - 20) - currentShotOffset;

        // 2. Отрисовка ЗАДНИХ водяных струй (по закону Паскаля во все стороны одинаково!)
        if (shotProgress > 0) {
            ctx.strokeStyle = 'rgba(0, 170, 255, 0.8)';
            ctx.lineWidth = 4;
            const numStreams = 8;
            for (let i = 0; i < numStreams; i++) {
                let ang = (i / numStreams) * Math.PI * 2 + angleY;
                // Струи сзади рисуются первыми
                if (Math.sin(ang) < 0) {
                    let streamLen = Math.sin(shotProgress) * 90;
                    let pStart = project(Math.cos(ang) * radius, baseBotY, Math.sin(ang) * radius);
                    let pEnd = project(Math.cos(ang) * (radius + streamLen), baseBotY - streamLen*0.2, Math.sin(ang) * (radius + streamLen));
                    ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                }
            }
        }

        // 3. Рисуем объёмную воду (цилиндр внутри колбы)
        if (waterLevel > 0.01) {
            for (let y = baseBotY; y < currentWaterY; y += 4) {
                let alpha = 0.25 * (1 - (currentWaterY - y) / (currentWaterY - baseBotY));
                draw3DCircle(y, radius - 1, null, `rgba(0, 140, 255, ${alpha})`);
            }
            draw3DCircle(currentWaterY, radius - 1, 'rgba(0, 210, 255, 0.5)', 'rgba(0, 170, 255, 0.4)');
        }

        // 4. Стеклянный прибор (корпус колбы)
        // Задние ребра стенок
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        draw3DCircle(baseBotY, radius, 'rgba(255, 255, 255, 0.25)');
        draw3DCircle(baseTopY, radius, 'rgba(255, 255, 255, 0.2)');

        // Вертикальные направляющие ребра колбы
        const sides = [0, Math.PI/2, Math.PI, Math.PI*1.5];
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        sides.forEach(s => {
            let pBot = project(Math.cos(s)*radius, baseBotY, Math.sin(s)*radius);
            let pTop = project(Math.cos(s)*radius, baseTopY, Math.sin(s)*radius);
            ctx.beginPath(); ctx.moveTo(pBot.x, pBot.y); ctx.lineTo(pTop.x, pTop.y); ctx.stroke();
        });

        // 5. Металлический Поршень
        draw3DCircle(pistonY, radius - 2, '#444', '#777');
        draw3DCircle(pistonY + 12, radius - 2, '#333', '#555');

        // 6. Пистолетная Рукоятка Нагнетания Давления
        let gunY = pistonY + 12;
        let pHandleBot = project(0, gunY, 0);
        let pHandleTop = project(0, gunY + 60, 0);
        
        ctx.strokeStyle = '#888'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(pHandleBot.x, pHandleBot.y); ctx.lineTo(pHandleTop.x, pHandleTop.y); ctx.stroke();

        let pGripEnd = project(25, gunY + 80, 0);
        ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.moveTo(pHandleTop.x, pHandleTop.y); ctx.lineTo(pGripEnd.x, pGripEnd.y); ctx.stroke();

        // 7. Отрисовка ПЕРЕДНИХ водяных струй (перекрывают колбу)
        if (shotProgress > 0) {
            ctx.strokeStyle = 'rgba(0, 190, 255, 0.9)';
            ctx.lineWidth = 4;
            const numStreams = 8;
            for (let i = 0; i < numStreams; i++) {
                let ang = (i / numStreams) * Math.PI * 2 + angleY;
                if (Math.sin(ang) >= 0) { // Струи, летящие вперед на зрителя
                    let streamLen = Math.sin(shotProgress) * 90;
                    let pStart = project(Math.cos(ang) * radius, baseBotY, Math.sin(ang) * radius);
                    let pEnd = project(Math.cos(ang) * (radius + streamLen), baseBotY - streamLen*0.2, Math.sin(ang) * (radius + streamLen));
                    ctx.beginPath(); ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y); ctx.stroke();
                }
            }
        }
    }

    // Игровой цикл обновлений
    function animate() {
        renderScene();
        requestAnimationFrame(animate);
    }

    // Старт движка при полной готовности страницы
    window.onload = init;
</script>
</body>
</html>
