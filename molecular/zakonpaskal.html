<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закон Паскаля: 3D Симуляция</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        #ui-panel {
            background: rgba(40, 40, 40, 0.95);
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #444;
        }

        #ui-panel h2 {
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00d2ff;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background: #333;
            color: #fff;
            border: 2px solid #555;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #00d2ff;
            color: #111;
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        button#fire-btn {
            background: #ff3366;
            border-color: #ff3366;
        }

        button#fire-btn:hover {
            background: #ff5588;
            border-color: #ff5588;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
        }

        #simulation-container {
            flex: 1;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Закон Паскаля 3D Симуляция</h2>
        <div class="controls">
            <button id="water-btn">Налить воду 💧</button>
            <button id="reset-btn">Сброс 🔄</button>
            <button id="fire-btn">ВЫСТРЕЛ 🔫</button>
        </div>
    </div>

    <div id="simulation-container"></div>
<script>
    const container = document.getElementById('simulation-container');
    let scene, camera, renderer, controls;
    let flask, water, piston;

    function init() {
        scene = new THREE.Scene();

        const width = container.clientWidth;
        const height = container.clientHeight;

        camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 5, 15);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00d2ff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        createPhysicsScene();

        window.addEventListener('resize', onWindowResize);

        document.getElementById('water-btn').onclick = () => fillWater();
        document.getElementById('reset-btn').onclick = () => resetSimulation();
        document.getElementById('fire-btn').onclick = () => fireShot();
    }

    function createPhysicsScene() {
        const grid = new THREE.GridHelper(20, 20, 0x00d2ff, 0x444444);
        grid.position.y = -4;
        scene.add(grid);

        const flaskGeo = new THREE.CylinderGeometry(2, 2, 6, 32, 1, true);
        const flaskMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
            roughness: 0.1,
            metalness: 0.1,
            transmission: 0.9,
            ior: 1.5,
            side: THREE.DoubleSide
        });
        flask = new THREE.Mesh(flaskGeo, flaskMat);
        flask.position.y = -1;
        scene.add(flask);

        const pistonGeo = new THREE.CylinderGeometry(1.95, 1.95, 0.4, 32);
        const pistonMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.2 });
        piston = new THREE.Mesh(pistonGeo, pistonMat);
        piston.position.y = 2.8; // Начальная позиция поршня чуть выше
        flask.add(piston);

        const waterGeo = new THREE.CylinderGeometry(1.9, 1.9, 4, 32);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x00aaff,
            transparent: true,
            opacity: 0.0
        });
        water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = -0.9;
        flask.add(water);
    }

    function onWindowResize() {
        const width = container.clientWidth;
        const height = container.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    }

    function fillWater() {
        water.material.opacity = 0.6;
        piston.position.y = 1.8; // Поршень ложится на воду
    }

    function resetSimulation() {
        water.material.opacity = 0.0;
        piston.position.y = 2.8;
    }

    function fireShot() {
        if(water.material.opacity < 0.1) {
            alert("Сначала налей воду 💧!");
            return;
        }
        // Небольшой толчок поршня вниз при выстреле
        piston.position.y = 1.5;
        setTimeout(() => { piston.position.y = 1.8; }, 200);
        console.log("Давление передалось!");
    }

    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        renderer.render(scene, camera);
    }

    init();
    animate();
</script>
</body>
</html>
