<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Физический квест: Гидравлический Пресс</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 { color: #0284c7; font-size: 24px; margin-bottom: 5px; text-align: center; }
        
        /* Индикатор прогресса уровней */
        .progress-bar-container {
            width: 100%;
            max-width: 900px;
            background: #e2e8f0;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .progress-fill {
            height: 100%;
            width: 20%;
            background: #10b981;
            transition: width 0.5s ease;
        }

        .formula-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            max-width: 900px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .formula-visual {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Cambria', serif;
            background: #f1f5f9;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .formula-desc { font-size: 13px; color: #475569; max-width: 500px; line-height: 1.4; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 930px;
            width: 100%;
            justify-content: center;
        }
        .canvas-container { 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        
        .task-panel {
            flex: 1;
            min-width: 340px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        .task-title { font-size: 16px; font-weight: bold; color: #0284c7; }
        .task-text {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid #3b82f6;
            font-weight: 500;
            min-height: 90px;
        }
        
        .input-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-box label { font-size: 14px; font-weight: bold; color: #334155; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            color: #0f172a;
            font-size: 20px;
            padding: 8px;
            border-radius: 6px;
            width: 140px;
            text-align: center;
            font-family: monospace;
        }
        input:focus { border-color: #3b82f6; outline: none; }
        .unit { font-size: 18px; font-weight: bold; color: #475569; }

        .btn-action {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 10px rgba(37,99,235,0.2);
        }
        .btn-action:hover { background: #1d4ed8; }
        
        .feedback {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            display: none;
            line-height: 1.4;
        }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <h1>🏋️ Инженерный квест: 5 уровней гидравлики</h1>
    
    <!-- Индикатор продвижения по квесту -->
    <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="formula-card">
        <div class="formula-visual">F₂ / F₁ = S₂ / S₁</div>
        <div class="formula-desc">
            <b>Закон Паскаля в действии:</b> Сила пресса прямо зависит от площадей его поршней. При расчётах помните, что ускорение свободного падения <b>g ≈ 10 Н/кг</b>.
        </div>
    </div>

    <div class="container">
        <!-- Чертеж гидравлической машины -->
        <div class="canvas-container">
            <canvas id="pressCanvas" width="440" height="360"></canvas>
        </div>

        <!-- Рабочая зона квеста -->
        <div class="task-panel">
            <div class="task-title" id="levelTitle">Уровень 1 из 5</div>
            <div class="task-text" id="taskLabel">Загрузка условий задачи...</div>
            
            <div class="input-box">
                <label id="inputLabel">Ответ:</label>
                <div class="input-row">
                    <input type="number" id="userAnswer" placeholder="Значение" step="any">
                    <span class="unit" id="unitLabel">Н</span>
                </div>
            </div>

            <button class="btn-action" id="checkBtn">⚡ Проверить и запустить</button>
            <div class="feedback" id="feedbackBlock"></div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('pressCanvas');
        const ctx = canvas.getContext('2d');

        const tubeBottomY = 280;
        let p1Y = 160; 
        let p2Y = 160; 
        
        let isAnimating = false;
        let animationDirection = "none"; 

        // Глобальный объект текущей задачи
        let currentTask = null;

        function drawSystem() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w1 = 40;  
            const w2 = 120; 
            const x1 = 60;
            const x2 = 260;

            // 1. Голубая жидкость (масло Паскаля)
            ctx.fillStyle = '#bae6fd'; 
            ctx.fillRect(x1, p1Y + 12, w1, tubeBottomY - p1Y - 12);
            ctx.fillRect(x1, tubeBottomY - 40, (x2 + w2) - x1, 40); 
            ctx.fillRect(x2, p2Y + 15, w2, tubeBottomY - p2Y - 15);

            // 2. Стенки пресса
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, 90); ctx.lineTo(x1, tubeBottomY); ctx.lineTo(x2 + w2, tubeBottomY); ctx.lineTo(x2 + w2, 90);
            ctx.moveTo(x1 + w1, 90); ctx.lineTo(x1 + w1, tubeBottomY - 40); ctx.lineTo(x2, tubeBottomY - 40); ctx.lineTo(x2, 90);
            ctx.stroke();

            // 3. Малый поршень
            ctx.fillStyle = '#ef4444'; 
            ctx.fillRect(x1 + 1, p1Y, w1 - 2, 14);
            ctx.fillStyle = '#475569';
            ctx.fillRect(x1 + w1/2 - 3, p1Y - 40, 6, 40);
            
            // Динамический вывод силы F1 (если ищем её — пишем знак '?')
            let f1Label = (currentTask && currentTask.hide === "f1") ? "F₁ = ?" : `F₁ = ${currentTask ? currentTask.f1 : 0} Н`;
            drawForceArrow(x1 + w1/2, p1Y - 45, true, f1Label);

            // 4. Большой поршень
            ctx.fillStyle = '#3b82f6'; 
            ctx.fillRect(x2 + 1, p2Y, w2 - 2, 18);
            ctx.fillStyle = '#475569';
            ctx.fillRect(x2 - 10, p2Y - 8, w2 + 20, 8);
            
            // Груз на прессе
            let gx = x2 + w2/2 - 30;
            let gy = p2Y - 58;
            ctx.fillStyle = '#334155';
            ctx.fillRect(gx, gy, 60, 50); 
            ctx.beginPath(); ctx.arc(x2 + w2/2, gy, 12, 0, Math.PI, true); ctx.stroke(); 

            // --- ЗАЩИТА ОТ ПОДСКАЗОК (Правка №1) ---
            // Проверяем, какую величину ищет ученик, и прячем её на схеме чертежа!
            let s1Label = (currentTask && currentTask.hide === "s1") ? "S₁ = ?" : `S₁ = ${currentTask ? currentTask.s1 : 0} см²`;
            let s2Label = (currentTask && currentTask.hide === "s2") ? "S₂ = ?" : `S₂ = ${currentTask ? currentTask.s2 : 0} см²`;
            let f2Label = (currentTask && currentTask.hide === "f2") ? "F₂ = ?" : `${currentTask ? currentTask.f2 : 0} Н`;

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(s1Label, x1 - 5, 80);
            ctx.fillText(s2Label, x2 + w2/2 - 30, 80);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(f2Label, x2 + w2/2 - 22, p2Y + 4);
        }

        function drawForceArrow(x, y, down, label) {
            ctx.strokeStyle = '#dc2626';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y - 20); ctx.lineTo(x, y);
            ctx.lineTo(x - 5, y - 6); ctx.moveTo(x, y); ctx.lineTo(x + 5, y - 6);
            ctx.stroke();
            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(label, x + 10, y - 5);
        }
        // Жестко заданные 5 уровней с нарастающей сложностью
        const questDatabase = [
            {
                level: 1,
                hide: "f2", // скрываем F2 на картинке
                text: "<b>Уровень 1 (Базовый):</b> Площадь малого поршня гидравлического пресса S₁ = 5 см², а большого S₂ = 100 см². На малый поршень подействовали силой F₁ = 50 Н. Какую максимальную выталкивающую силу F₂ развивает большой поршень?",
                inputLabel: "Вычисли силу F₂:",
                unit: "Н",
                s1: 5, s2: 100, f1: 50, f2: 1000,
                expected: 1000
            },
            {
                level: 2,
                hide: "f1", // скрываем F1 на картинке
                text: "<b>Уровень 2 (Поиск силы нажатия):</b> Инженерам нужно, чтобы гидравлический подъемник удерживал вес F₂ = 8000 Н. Площадь большого цилиндра S₂ = 400 см², а малого управляющего S₁ = 10 см². Какую силу F₁ рабочий должен приложить к малому поршню?",
                inputLabel: "Вычисли силу F₁:",
                unit: "Н",
                s1: 10, s2: 400, f1: 200, f2: 8000,
                expected: 200
            },
            {
                level: 3,
                hide: "s1", // скрываем S1 на картинке
                text: "<b>Уровень 3 (Поиск площади):</b> Гидравлическая машина создает выигрыш в силе, поднимая груз весом F₂ = 6000 Н при помощи силы F₁ = 150 Н. Найдите площадь малого поршня S₁, если площадь большого поршня S₂ составляет 200 см².",
                inputLabel: "Вычисли площадь S₁:",
                unit: "см²",
                s1: 5, s2: 200, f1: 150, f2: 6000,
                expected: 5
            },
            {
                level: 4,
                hide: "f2", // скрываем F2 на картинке, так как там вес, а в задаче дана МАССА
                text: "<b>Уровень 4 (Переход от массы):</b> На платформу большого поршня площадью S₂ = 500 см² загнали тяжелый станок массой <b>m = 2.5 тонны (2500 кг)</b>. Какую силу нужно приложить к малому поршню площадью S₁ = 4 см², чтобы поднять этот станок? (Примите g = 10 Н/кг).",
                inputLabel: "Вычисли силу F₁:",
                unit: "Н",
                s1: 4, s2: 500, f1: 200, f2: 25000, // F2 = 2500 * 10 = 25000 Н
                expected: 200
            },
            {
                level: 5,
                hide: "f1", // скрываем F1, так как на малый поршень давит еще и рычаг
                text: "<b>Уровень 5 (Супер-инженер):</b> К малому поршню площадью S₁ = 2 см² прикрепили ручной рычаг, который дает дополнительный выигрыш в силе в <b>5 раз</b>. Пресс должен поднять груз массой 300 кг (F₂ = 3000 Н) на большом поршне площадью S₂ = 100 см². Какую силу нужно приложить к концу рычага?",
                inputLabel: "Вычисли финальную силу на конце рычага:",
                unit: "Н",
                s1: 2, s2: 100, f1: 60, f2: 3000, // Без рычага F1=60Н, а с рычагом 60 / 5 = 12Н
                expected: 12
            }
        ];

        let currentLevelIdx = 0;

        function loadQuest(idx) {
            currentTask = questDatabase[idx];
            
            // Обновляем прогресс-бар и тексты
            document.getElementById('progressFill').style.width = ((idx + 1) * 20) + "%";
            document.getElementById('levelTitle').innerText = `Уровень ${currentTask.level} из 5`;
            document.getElementById('taskLabel').innerHTML = currentTask.text;
            document.getElementById('inputLabel').innerText = currentTask.inputLabel;
            document.getElementById('unitLabel').innerText = currentTask.unit;
            
            // Сброс графики поршней
            p1Y = 160; p2Y = 160;
            isAnimating = false;
            animationDirection = "none";
            
            document.getElementById('userAnswer').value = "";
            document.getElementById('feedbackBlock').style.display = "none";
            document.getElementById('checkBtn').style.display = "block";
            document.getElementById('checkBtn').innerText = "⚡ Проверить и запустить";
            
            drawSystem();
        }

        function animatePress() {
            if (!isAnimating) return;

            if (animationDirection === "up") {
                if (p1Y < 195) {
                    p1Y += 0.5;
                    p2Y -= 0.5 * (currentTask.s1 / currentTask.s2 * 4.5);
                } else {
                    isAnimating = false;
                    // --- АВТОМАТИЧЕСКИЙ ПЕРЕХОД ПОСЛЕ АНИМАЦИИ (Правка №2) ---
                    setTimeout(() => {
                        currentLevelIdx++;
                        if (currentLevelIdx < questDatabase.length) {
                            loadQuest(currentLevelIdx);
                        } else {
                            // Финал квеста
                            document.getElementById('taskLabel').innerHTML = "🏆 <b>ПОЗДРАВЛЯЕМ!</b> Ты прошел все 5 уровней инженерной гидравлики и доказал, что умеешь крутить закон Паскаля как мастер!";
                            document.getElementById('checkBtn').style.display = "none";
                            document.getElementById('feedbackBlock').style.display = "none";
                        }
                    }, 1500); // задержка в 1.5 секунды, чтобы ребенок успел порадоваться успеху
                }
            } else if (animationDirection === "fail") {
                p1Y += 3;
                setTimeout(() => { p1Y = 160; drawSystem(); }, 120);
                isAnimating = false;
            }

            drawSystem();
            if (isAnimating) requestAnimationFrame(animatePress);
        }

        // Обработчик проверки ответа
        document.getElementById('checkBtn').addEventListener('click', () => {
            if (isAnimating) return; // блокировка кликов во время движения
            
            const userAns = parseFloat(document.getElementById('userAnswer').value);
            const feed = document.getElementById('feedbackBlock');
            feed.style.display = "block";

            if (isNaN(userAns)) {
                feed.className = "feedback error";
                feed.innerText = "⚠️ Сначала введи числовой ответ в поле!";
                return;
            }

            // Сравниваем ответ с эталоном
            if (Math.abs(userAns - currentTask.expected) < 0.1) {
                feed.className = "feedback success";
                feed.innerHTML = `🎉 Верно! Система пришла в движение. Поршни успешно выполняют работу!`;
                
                document.getElementById('checkBtn').innerText = "🔄 Загрузка следующего уровня...";
                isAnimating = true;
                animationDirection = "up";
                animatePress();
            } else {
                feed.className = "feedback error";
                feed.innerHTML = `❌ Расчет неверный. Система заклинила! Попробуй перепроверить пропорцию <b>F₂ / F₁ = S₂ / S₁</b> на бумаге еще раз.`;
                
                isAnimating = true;
                animationDirection = "fail";
                animatePress();
            }
        });

        // Первичный запуск квеста
        loadQuest(currentLevelIdx);
    </script>
</body>
</html>
