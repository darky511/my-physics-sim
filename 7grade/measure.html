<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игровой СИ-Конструктор</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; text-align: center; }
        .container {
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        /* Главное табло задачи */
        .quest-board {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffd43b;
            margin-bottom: 25px;
            border: 2px solid #334155;
        }
        /* Визуальный конвейер трансформации числа */
        .conveyor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #334155;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .node {
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            border: 2px solid #475569;
            min-width: 80px;
            text-align: center;
        }
        .arrow { font-size: 24px; color: #94a3b8; }
        /* Пустой слот для кубика */
        .slot {
            background: #0f172a;
            border: 2px dashed #38bdf8;
            color: #38bdf8;
            min-width: 110px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        .slot.filled {
            background: #0284c7;
            color: white;
            border-style: solid;
        }
        /* Сетка доступных кубиков-действий */
        .blocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .cube-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 15px 10px;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.15s;
            text-align: center;
        }
        .cube-btn:hover { background: #64748b; transform: translateY(-2px); }
        .cube-btn:active { transform: translateY(0); }
        
        .feedback {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .success { background: rgba(16, 185, 129, 0.15); color: #4ade80; border: 1px solid #10b981; }
        .error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <h1>⚡ СИ-Конструктор: Энергетический Мост</h1>
    <div class="subtitle">Подбери правильный кубик-модификатор, чтобы перевести параметры в систему СИ!</div>

    <div class="container">
        <!-- Табло текущего квеста -->
        <div class="quest-board" id="questText">Загрузка космической системы...</div>

        <!-- Схема физического конвейера -->
        <div class="conveyor">
            <div class="node" id="startNode">0</div>
            <div class="arrow">➔</div>
            <div class="slot" id="operatorSlot">[ Выбери кубик ]</div>
            <div class="arrow">➔</div>
            <div class="node" id="resultNode">?</div>
        </div>

        <!-- Панель выбора интерактивных кубиков -->
        <label style="font-weight: bold; color: #94a3b8; display: block; margin-bottom: 10px;">Доступные кубики-модификаторы:</label>
        <div class="blocks-grid" id="gridContainer"></div>

        <!-- Уведомления об успехе/ошибке -->
        <div class="feedback" id="feedbackMessage"></div>
    </div>
    <script>
        // Полностью автономная и проверенная база задач без внешних зависимостей
        const missions = [
            { text: "Переведи путь: 5 км ➔ ? метров (СИ)", start: 5, blockLabel: "· 1000", resultStr: "5000 м", isCorrect: (label) => label === "· 1000" },
            { text: "Переведи массу: 450 г ➔ ? килограмм (СИ)", start: 450, blockLabel: ": 1000", resultStr: "0.45 кг", isCorrect: (label) => label === ": 1000" },
            { text: "Переведи размер: 20 см ➔ ? метров (СИ)", start: 20, blockLabel: ": 100", resultStr: "0.2 м", isCorrect: (label) => label === ": 100" },
            { text: "Переведи время: 3 минуты ➔ ? секунд (СИ)", start: 3, blockLabel: "· 60", resultStr: "180 с", isCorrect: (label) => label === "· 60" },
            { text: "Переведи скорость: 72 км/ч ➔ ? м/с (СИ)", start: 72, blockLabel: ": 3.6", resultStr: "20 м/с", isCorrect: (label) => label === ": 3.6" },
            { text: "Переведи площадь: 5 см² ➔ ? м² (СИ)", start: 5, blockLabel: ": 10000", resultStr: "0.0005 м²", isCorrect: (label) => label === ": 10000" },
            { text: "Переведи объём: 8 литров ➔ ? м³ (СИ)", start: 8, blockLabel: ": 1000", resultStr: "0.008 м³", isCorrect: (label) => label === ": 1000" }
        ];

        // Все доступные варианты кубиков, которые мы разложим перед учеником на столе
        const availablePool = ["· 1000", ": 1000", ": 100", "· 60", ": 3.6", ": 10000", "· 100", ": 60"];

        let currentMissionIdx = 0;

        // Генерация кнопок-кубиков на панели
        function renderCubeButtons() {
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = ""; // очистка

            availablePool.forEach(label => {
                const btn = document.createElement('button');
                btn.className = 'cube-btn';
                btn.innerText = label;
                // Привязываем событие клика по кубику
                btn.onclick = () => handleCubeClick(label);
                grid.appendChild(btn);
            });
        }
        function loadMission(idx) {
            const mission = missions[idx];
            
            // Обновляем текстовые элементы на табло
            document.getElementById('questText').innerText = mission.text;
            document.getElementById('startNode').innerText = mission.start;
            
            // Сбрасываем центральный слот в пустое состояние
            const slot = document.getElementById('operatorSlot');
            slot.innerText = "[ Выбери кубик ]";
            slot.className = "slot";
            
            document.getElementById('resultNode').innerText = "?";
            document.getElementById('feedbackMessage').style.display = "none";
        }

        function handleCubeClick(chosenLabel) {
            const mission = missions[currentMissionIdx];
            const slot = document.getElementById('operatorSlot');
            const feed = document.getElementById('feedbackMessage');

            // Анимируем вставку кубика в слот конвейера
            slot.innerText = chosenLabel;
            slot.className = "slot filled";
            feed.style.display = "block";

            // Проверяем, правильный ли кубик выбрал ученик
            if (mission.isCorrect(chosenLabel)) {
                // Если выбор верен
                document.getElementById('resultNode').innerText = mission.resultStr;
                feed.className = "feedback success";
                feed.innerHTML = `🎉 Великолепно! Энергетический мост стабилен. <br> Выбран правильный масштаб приставки: <b>${mission.start} ${chosenLabel.replace('·', '×').replace(':', '÷')} = ${mission.resultStr}</b>`;

                // Автопереход к следующей загадке через 3 секунды
                setTimeout(() => {
                    currentMissionIdx = (currentMissionIdx + 1) % missions.length;
                    loadMission(currentMissionIdx);
                }, 3000);
            } else {
                // Если кубик не подошел
                document.getElementById('resultNode').innerText = "Ошибка";
                feed.className = "feedback error";
                feed.innerText = `❌ Цепь разорвана! Модификатор "${chosenLabel}" не подходит для этой величины. Подумай, во сколько раз отличаются исходная единица и системная (СИ), и уменьшиться должно число или увеличиться?`;
            }
        }

        // Самый первый запуск игры при открытии файла в браузере
        renderCubeButtons();
        loadMission(currentMissionIdx);
    </script>
</body>
</html>
