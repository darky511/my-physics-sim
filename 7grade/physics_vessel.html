<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная физика: Движение цилиндра</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #4dabf7; margin-bottom: 10px; text-align: center; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }
        .canvas-container { background: #2b2b36; border-radius: 12px; padding: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .controls {
            flex: 1;
            min-width: 280px;
            background: #2b2b36;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-pump-in { background: #ff922b; color: #fff; }
        .btn-pump-in:hover { background: #f76707; }
        .btn-pump-out { background: #22b8cf; color: #fff; }
        .btn-pump-out:hover { background: #0c8599; }
        .btn-reset { background: #868e96; color: #fff; }
        .btn-reset:hover { background: #495057; }
        .stat-box {
            background: #1e1e24;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #4dabf7;
        }
        .stat-value { font-weight: bold; color: #ffd43b; }
    </style>
</head>
<body>

    <h1>🎮 Физический эксперимент: Жесткий цилиндр на поршне</h1>
    
    <div class="container">
        <div class="canvas-container">
            <canvas id="physicsCanvas" width="360" height="450"></canvas>
        </div>
        
        <div class="controls">
            <h3>Управление насосом:</h3>
            <button class="btn-pump-in" id="pumpInBtn">💨 Накачать воздух в сосуд</button>
            <button class="btn-pump-out" id="pumpOutBtn">🌪️ Откачать воздух из сосуда</button>
            <button class="btn-reset" id="resetBtn">🔄 Сброс системы</button>
            
            <h3>Датчики показателей:</h3>
            <div class="stat-box">Давление в сосуде: <span id="pVesselText" class="stat-value">100</span> кПа</div>
            <div class="stat-box">Давление под колпаком: <span id="pInText" class="stat-value">100</span> кПа</div>
            <div class="stat-box">Положение цилиндра: <span id="posText" class="stat-value">Стабильно</span></div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');

        // Физические параметры
        let pVessel = 100;    // Давление во внешнем сосуде (кПа)
        let cylinderY = 200;  // Координата Y крышки цилиндра
        let targetY = 200;    // Целевое положение крышки
        
        const pistonY = 270;  // Неподвижный поршень (не двигается!)
        const mass = 15;      // Влияние веса цилиндра (сдвигает баланс сил)

        // Геометрия элементов (теперь у цилиндра жесткая фиксированная высота!)
        const vesselX = 60, vesselY = 40, vesselW = 240, vesselH = 360;
        const pistonX = 140, pistonW = 80, pistonH = 12;
        const rodX = 176, rodW = 8, rodH = 130;
        
        const cylX = 136;
        const cylW = 88;
        const cylH = 120; // Жесткая высота цилиндра — она НЕ меняется!

        function drawSystem() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Внешний сосуд и его атмосфера
            let vesselAlpha = Math.min(0.7, pVessel / 300);
            ctx.fillStyle = `rgba(77, 171, 247, ${vesselAlpha})`;
            ctx.fillRect(vesselX, vesselY, vesselW, vesselH);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.strokeRect(vesselX, vesselY, vesselW, vesselH);

            // Трубка насоса
            ctx.beginPath();
            ctx.moveTo(vesselX, vesselY + 50);
            ctx.lineTo(vesselX - 20, vesselY + 50);
            ctx.stroke();

            // 2. Неподвижный поршень со шрафом ко дну
            ctx.fillStyle = '#868e96';
            ctx.fillRect(rodX, pistonY + pistonH, rodW, rodH);
            ctx.fillStyle = '#666';
            ctx.fillRect(pistonX, pistonY, pistonW, pistonH);

            // 3. Газ, запертый внутри (между неподвижным поршнем и подвижной крышкой)
            let gasHeight = pistonY - cylinderY; 
            let pInternal = Math.round((115 * 70) / Math.max(10, gasHeight));

            if (gasHeight > 0) {
                let innerAlpha = Math.min(0.9, pInternal / 300);
                ctx.fillStyle = `rgba(255, 107, 107, ${innerAlpha})`;
                ctx.fillRect(cylX + 4, cylinderY + 4, cylW - 8, gasHeight);
            }

            // 4. ПОДВИЖНЫЙ ТВЕРДЫЙ ЦИЛИНДР (рисуется как единый передвигающийся каркас)
            ctx.strokeStyle = '#ffd43b';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            // Левая стенка жесткой длины cylH
            ctx.moveTo(cylX, cylinderY + cylH); 
            ctx.lineTo(cylX, cylinderY);
            // Верхняя крышка, на которую давит внешнее давление
            ctx.lineTo(cylX + cylW, cylinderY);
            // Правая стенка жесткой длины cylH
            ctx.lineTo(cylX + cylW, cylinderY + cylH);
            ctx.stroke();

            // Информационная панель
            document.getElementById('pVesselText').innerText = Math.round(pVessel);
            document.getElementById('pInText').innerText = pInternal;
            
            let statusText = "В равновесии";
            if (cylinderY < targetY - 1) statusText = "📉 Опускается на поршень";
            if (cylinderY > targetY + 1) statusText = "🚀 Скользит вверх по поршню";
            if (cylinderY <= vesselY + 6) statusText = "💥 Упёрся в верхнюю стенку!";
            if (cylinderY >= pistonY - 15) statusText = "⚠️ Сел крышкой на поршень!";
            document.getElementById('posText').innerText = statusText;
        }
        function updatePhysics() {
            // Закон Бойля-Мариотта для запертого газа: P_внеш + вес = P_внутр
            // Изменение внешнего давления заставляет цилиндр смещаться, меняя объем газа
            let targetGasHeight = (115 * 70) / (pVessel + mass);
            targetY = pistonY - targetGasHeight;

            // Ограничения физического тела внутри камеры
            if (targetY < vesselY + 5) targetY = vesselY + 5; // Потолок сосуда
            if (targetY > pistonY - 10) targetY = pistonY - 10; // Крышка легла на поршень

            // Реалистичное плавное скольжение стакана по поршню
            cylinderY += (targetY - cylinderY) * 0.08;

            drawSystem();
            requestAnimationFrame(updatePhysics);
        }

        // Кнопки управления давлением во внешней камере
        document.getElementById('pumpInBtn').addEventListener('click', () => {
            if (pVessel < 260) pVessel += 30;
        });

        document.getElementById('pumpOutBtn').addEventListener('click', () => {
            if (pVessel > 30) pVessel -= 30;
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            pVessel = 100;
        });

        // Старт физического движка
        updatePhysics();
    </script>
</body>
</html>
