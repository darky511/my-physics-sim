<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Физическая Лаборатория: Сила Архимеда</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 { color: #0891b2; font-size: 24px; margin-bottom: 5px; text-align: center; }
        
        /* Шкала прогресса квеста */
        .progress-bar-container {
            width: 100%;
            max-width: 920px;
            background: #e2e8f0;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .progress-fill {
            height: 100%;
            width: 20%;
            background: #06b6d4;
            transition: width 0.5s ease;
        }

        /* Карточка формулы */
        .formula-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            max-width: 920px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .formula-visual {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Cambria', serif;
            background: #f1f5f9;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            color: #0891b2;
        }
        .formula-desc { font-size: 13px; color: #475569; max-width: 500px; line-height: 1.4; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            justify-content: center;
        }
        .canvas-container { 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        
        /* Правая панель карточки задачи */
        .task-panel {
            flex: 1;
            min-width: 350px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        .task-title { font-size: 16px; font-weight: bold; color: #0891b2; }
        .task-text {
            background: #ecfeff;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid #06b6d4;
            font-weight: 500;
            min-height: 110px;
        }
        
        .input-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-box label { font-size: 14px; font-weight: bold; color: #334155; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            color: #0f172a;
            font-size: 20px;
            padding: 8px;
            border-radius: 6px;
            width: 140px;
            text-align: center;
            font-family: monospace;
        }
        input:focus { border-color: #06b6d4; outline: none; }
        .unit { font-size: 18px; font-weight: bold; color: #475569; }

        .btn-action {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            background: #0891b2;
            color: white;
            box-shadow: 0 4px 10px rgba(8,145,178,0.2);
        }
        .btn-action:hover { background: #0e7490; }
        
        .feedback {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            display: none;
            line-height: 1.4;
        }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <h1>⚓ Физический симулятор: Сила Архимеда в действии</h1>
    
    <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="formula-card">
        <div class="formula-visual">F_A = ρ_жид · g · V_погр</div>
        <div class="formula-desc">
            <b>Закон Архимеда:</b> Выталкивающая сила строго зависит от плотности среды и объёма <i>погружённой</i> части тела. Обращайте внимание на схему эксперимента!
        </div>
    </div>

    <div class="container">
        <!-- Стенд со сменной графикой -->
        <div class="canvas-container">
            <canvas id="archimedesCanvas" width="460" height="380"></canvas>
        </div>
        <!-- Панель условий задач -->
        <div class="task-panel">
            <div class="task-title" id="levelTitle">Уровень 1 из 5</div>
            <div class="task-text" id="taskLabel">Запуск физических модулей...</div>
            
            <div class="input-box">
                <label id="inputLabel">Твой ответ:</label>
                <div class="input-row">
                    <input type="number" id="userAnswer" placeholder="Значение" step="any">
                    <span class="unit" id="unitLabel">Н</span>
                </div>
            </div>

            <button class="btn-action" id="checkBtn">⚡ Запустить эксперимент</button>
            <div class="feedback" id="feedbackBlock"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('archimedesCanvas');
        const ctx = canvas.getContext('2d');

        // Анимационные переменные положения тела
        let bodyY = 110; 
        let isAnimating = false;
        let animationType = "none"; // "success", "fail"

        let currentTask = null;

        function drawSystem() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const glassX = 130, glassY = 160, glassW = 200, glassH = 200;
            const waterLevelY = glassY + 60; 
            const dynX = glassX + glassW / 2;
            const bodyW = 70, bodyH = 70;
            const bx = dynX - bodyW / 2;

            // 1. ОТРИСОВКА ОКРУЖЕНИЯ В ЗАВИСИМОСТИ ОТ УРОВНЯ
            if (currentTask && currentTask.level === 3) {
                // Космический уровень: звёздное небо под куполом
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(40, 40, 2, 2); ctx.fillRect(410, 70, 3, 3); ctx.fillRect(60, 320, 2, 2);
            }

            // 2. ОТРИСОВКА ЖИДКОСТИ
            ctx.fillStyle = (currentTask && currentTask.level === 3) ? '#22c55e' : '#7dd3fc'; // Метан зеленый, вода голубая
            ctx.globalAlpha = 0.6;
            ctx.fillRect(glassX + 4, waterLevelY, glassW - 8, glassH - 64);
            ctx.globalAlpha = 1.0;

            // 3. СТЕНКИ СТАКАНА
            ctx.strokeStyle = (currentTask && currentTask.level === 3) ? '#94a3b8' : '#475569';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(glassX, glassY); ctx.lineTo(glassX, glassY + glassH);
            ctx.lineTo(glassX + glassW, glassY + glassH); ctx.lineTo(glassX + glassW, glassY);
            ctx.stroke();

            // 4. ОСОБАЯ ОТРЫСОВКА СВЯЗЕЙ ПОД КАЖДЫЙ УРОВЕНЬ
            if (currentTask) {
                switch(currentTask.level) {
                    case 1:
                        // Уровень 1: Традиционный динамометр с пружиной
                        drawDynamometer(dynX);
                        drawSpring(dynX, 70, bodyY);
                        break;
                    case 2:
                        // Уровень 2: Свободное плавание! Никаких приборов и пружин сверху!
                        // В состоянии покоя тело просто качается на воде
                        break;
                    case 3:
                        // Уровень 3: Космос. Роботизированный трос вместо пружины
                        ctx.strokeStyle = '#cbd5e1';
                        ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.moveTo(dynX, 0); ctx.lineTo(dynX, bodyY); ctx.stroke();
                        break;
                    case 4:
                        // Уровень 4: Платформа подводных весов на дне резервуара
                        ctx.strokeStyle = '#475569';
                        ctx.lineWidth = 4;
                        // Ножки-пружины весов на дне
                        drawSpring(glassX + 60, glassY + glassH - 5, bodyY + bodyH);
                        drawSpring(glassX + glassW - 60, glassY + glassH - 5, bodyY + bodyH);
                        // Сама опора весов, на которой стоит валун
                        ctx.fillStyle = '#94a3b8';
                        ctx.fillRect(bx - 10, bodyY + bodyH, bodyW + 20, 8);
                        break;
                    case 5:
                        // Уровень 5: Удерживающий гидравлический упор, давящий сверху
                        ctx.fillStyle = '#64748b';
                        ctx.fillRect(dynX - 8, 0, 16, bodyY); // шток поршня сверху
                        ctx.fillStyle = '#475569';
                        ctx.fillRect(bx - 5, bodyY - 8, bodyW + 10, 8); // упорная планка
                        break;
                }
            }

            // 5. ТЕЛО (ОБРАЗЕЦ)
            ctx.fillStyle = (currentTask && currentTask.level === 4) ? '#64748b' : '#b45309'; // Валун серый, бруски деревянные
            ctx.fillRect(bx, bodyY, bodyW, bodyH);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, bodyY, bodyW, bodyH);

            // 6. СИЛЫ НА КАРТИНКЕ (СТРОГО БЕЗ СПОЙЛЕРОВ)
            let hideSystem = currentTask && currentTask.hide ? currentTask.hide : "";

            if (bodyY > 140) {
                // Сила тяжести (Вниз)
                drawArrow(dynX, bodyY + bodyH / 2, dynX, bodyY + bodyH + 35, '#dc2626', "F_тяж");
                
                // Сила Архимеда (Вверх, появляется только при контакте с жидкостью)
                if (bodyY + bodyH > waterLevelY) {
                    let faLabel = hideSystem.includes("fa") ? "F_A = ?" : `F_A = ${currentTask.fa} Н`;
                    drawArrow(dynX - 25, bodyY + bodyH / 2, dynX - 25, bodyY - 20, '#0284c7', faLabel);
                }

                // Сила упругости пружины/весов/упора (Отрисовывается только там, где она физически есть!)
                if (currentTask.level === 1) {
                    drawArrow(dynX + 25, bodyY + bodyH / 2, dynX + 25, bodyY - 15, '#16a34a', "F_упр");
                } else if (currentTask.level === 4) {
                    drawArrow(dynX + 25, bodyY + bodyH / 2, dynX + 25, bodyY - 15, '#16a34a', "N (реакция весов)");
                } else if (currentTask.level === 5) {
                    // Сила упора давит НА тело сверху вниз!
                    drawArrow(dynX, bodyY, dynX, bodyY + 25, '#16a34a', "F_упора");
                }
            }

            // Вывод справочных параметров среды
            ctx.fillStyle = (currentTask && currentTask.level === 3) ? '#f8fafc' : '#0f172a';
            ctx.font = 'bold 11px sans-serif';
            
            let rhoLabel = hideSystem.includes("rho") ? "ρ_жид = ?" : `ρ_жид = ${currentTask ? currentTask.rho : 0} кг/м³`;
            let vLabel = hideSystem.includes("v") ? "V_тела = ?" : `V_тела = ${currentTask ? currentTask.v : 0} м³`;
            let gLabel = hideSystem.includes("g") ? "g = ?" : `g = ${currentTask ? currentTask.g : 10} Н/кг`;

            ctx.fillText(rhoLabel, glassX + 15, glassY + glassH + 20);
            ctx.fillText(vLabel, glassX + 15, glassY + glassH + 35);
            ctx.fillText(gLabel, glassX + 15, glassY + glassH + 50);
        }

        // Вспомогательные функции черчения
        function drawDynamometer(x) {
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, 30); ctx.stroke();
            ctx.fillStyle = '#f1f5f9';
            ctx.fillRect(x - 12, 30, 24, 40);
            ctx.strokeRect(x - 12, 30, 24, 40);
        }

        function drawSpring(x, startY, endY) {
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, startY);
            let turns = 6;
            let step = (endY - startY) / turns;
            for (let i = 0; i < turns; i++) {
                let sy = startY + i * step;
                ctx.lineTo(x + (i % 2 === 0 ? 7 : -7), sy + step / 2);
            }
            ctx.lineTo(x, endY);
            ctx.stroke();
        }

        function drawArrow(x1, y1, x2, y2, color, label) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            let angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - 6 * Math.cos(angle - Math.PI / 6), y2 - 6 * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - 6 * Math.cos(angle + Math.PI / 6), y2 - 6 * Math.sin(angle + Math.PI / 6));
            ctx.fill();
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText(label, x2 + 8, y2 + (y2 < y1 ? 10 : -4));
        }
        // Абсолютно разнородные 5 задач с уникальной физикой сред и креплений
        const questDatabase = [
            {
                level: 1,
                hide: "fa",
                text: "<b>Уровень 1 (Классический динамометр):</b> Алюминиевый брусок объёмом V = 0.003 м³ полностью погрузили в воду (ρ = 1000 кг/м³). Какая выталкивающая сила Архимеда действует на образец? (Примите g = 10 Н/кг).",
                inputLabel: "Вычисли силу Архимеда F_A:",
                unit: "Н",
                rho: 1000, v: 0.003, g: 10, fa: 30,
                expected: 30,
                finalY: 185 
            },
            {
                level: 2,
                hide: "fa",
                text: "<b>Уровень 2 (Свободное плавание):</b> Деревянный куб объёмом V = 0.008 м³ свободно плавает на поверхности бака с керосином (ρ = 800 кг/м³), погрузившись в него строго <b>наполовину (1/2 своего объёма)</b>. Чему равна выталкивающая сила Архимеда? (Примите g = 10 Н/кг).",
                inputLabel: "Вычисли силу Архимеда при полупогружении:",
                unit: "Н",
                rho: 800, v: 0.008, g: 10, fa: 32, // F_A = 800 * 10 * 0.004 = 32 Н
                expected: 32,
                finalY: 125 // тело плавает высоко, на поверхности
            },
            {
                level: 3,
                hide: "g fa",
                text: "<b>Уровень 3 (Космический метановый океан):</b> На далёком спутнике исследовательский зонд объёмом V = 0.04 м³ опустили на стальном кабеле в жидкий метан (ρ = 400 кг/м³). Датчик натяжения кабеля зафиксировал силу Архимеда, равную F_A = 160 Н. Чему равно <b>ускорение свободного падения g</b> на этой планете?",
                inputLabel: "Вычисли планетарное ускорение g:",
                unit: "Н/кг",
                rho: 400, v: 0.04, g: 10, fa: 160, // 160 = 400 * g * 0.04 => 160 = 16 * g => g = 10
                expected: 10,
                finalY: 185
            },
            {
                level: 4,
                hide: "fa",
                text: "<b>Уровень 4 (Подводные напольные весы):</b> Гранитный валун массой m = 40 кг и объёмом V = 0.012 м³ лежит на весах, установленных на самом дне резервуара с водой (ρ = 1000 кг/м³). Какую силу веса зафиксируют подводные весы? (Примите g = 10 Н/кг).",
                inputLabel: "Рассчитай вес тела в воде:",
                unit: "Н",
                rho: 1000, v: 0.012, g: 10, fa: 120, // F_тяж = 400 Н. F_A = 1000*10*0.012 = 120 Н. Напольные весы покажут 400 - 120 = 280 Н
                expected: 280,
                finalY: 285 // опускается на самое дно стакана!
            },
            {
                level: 5,
                hide: "fa rho v",
                text: "<b>Уровень 5 (Удерживающий гидравлический упор):</b> Полая деталь массой m = 15 кг и общим наружным объёмом V = 0.025 м³ находится в баке с водой (ρ = 1000 кг/м³). Механический упор давит на неё сверху, не давая всплыть. Какую <b>силу давления упора</b> нужно приложить, чтобы деталь оставалась полностью под водой? (Примите g = 10 Н/кг).",
                inputLabel: "Вычисли силу прижимного упора сверху:",
                unit: "Н",
                rho: 1000, v: 0.025, g: 10, fa: 250, // F_A = 1000*10*0.025 = 250 Н. F_тяж = 15 * 10 = 150 Н. Сила упора сверху = 250 - 150 = 100 Н
                expected: 100,
                finalY: 185
            }
        ];

        let currentLevelIdx = 0;

        function loadQuest(idx) {
            currentTask = questDatabase[idx];
            
            // Смена текстовых полей
            document.getElementById('progressFill').style.width = ((idx + 1) * 20) + "%";
            document.getElementById('levelTitle').innerText = `Уровень ${currentTask.level} из 5`;
            document.getElementById('taskLabel').innerHTML = currentTask.text;
            document.getElementById('inputLabel').innerText = currentTask.inputLabel;
            document.getElementById('unitLabel').innerText = currentTask.unit;
            
            // Настройка стартовой высоты анимации под задачу
            // На 2 уровне куб сразу плавает на поверхности, на остальных плавно погружается сверху
            bodyY = (currentTask.level === 2) ? 125 : 100;
            isAnimating = false;
            animationType = "none";
            
            document.getElementById('userAnswer').value = "";
            document.getElementById('feedbackBlock').style.display = "none";
            document.getElementById('checkBtn').style.display = "block";
            document.getElementById('checkBtn').innerText = "⚡ Запустить эксперимент";
            
            drawSystem();
        }

        function animateProcess() {
            if (!isAnimating) return;

            if (animationType === "success") {
                // Если ответ верный — тело плавно занимает своё расчётное физическое положение
                if (bodyY < currentTask.finalY) {
                    bodyY += 1.0;
                } else {
                    isAnimating = false;
                    setTimeout(() => {
                        currentLevelIdx++;
                        if (currentLevelIdx < questDatabase.length) {
                            loadQuest(currentLevelIdx);
                        } else {
                            // Конец игры
                            document.getElementById('taskLabel').innerHTML = "🏆 <b>ВЕЛИКОЛЕПНЫЙ РЕЗУЛЬТАТ! КВЕСТ ЗАВЕРШЕН!</b> Ты успешно настроил гидростатический баланс на всех 5 уникальных стендах. От свободного плавания до космического океана и подводных весов — ты безупречно владеешь законом Архимеда!";
                            document.getElementById('checkBtn').style.display = "none";
                            document.getElementById('feedbackBlock').style.display = "none";
                            document.getElementById('progressFill').style.background = "#06b6d4";
                        }
                    }, 1800);
                }
            } else if (animationType === "fail") {
                // Если ошибка — тело дёргается (срыв эксперимента) и возвращается назад
                bodyY += 4;
                setTimeout(() => { 
                    bodyY = (currentTask.level === 2) ? 125 : 100; 
                    drawSystem(); 
                }, 120);
                isAnimating = false;
            }

            drawSystem();
            if (isAnimating) requestAnimationFrame(animateProcess);
        }

        // Обработчик кнопки запуска
        document.getElementById('checkBtn').addEventListener('click', () => {
            if (isAnimating) return;
            
            const userAns = parseFloat(document.getElementById('userAnswer').value);
            const feed = document.getElementById('feedbackBlock');
            feed.style.display = "block";

            if (isNaN(userAns)) {
                feed.className = "feedback error";
                feed.innerText = "⚠️ Пожалуйста, введи числовой ответ перед запуском!";
                return;
            }

            // Сравнение ответа
            if (Math.abs(userAns - currentTask.expected) < 0.1) {
                feed.className = "feedback success";
                feed.innerHTML = `🎉 Верно! Физические датчики подтверждают точность твоего расчёта. Стенд запущен!`;
                
                document.getElementById('checkBtn').innerText = "🔄 Синхронизация данных...";
                isAnimating = true;
                animationType = "success";
                animateProcess();
            } else {
                feed.className = "feedback error";
                feed.innerHTML = `❌ Ошибка в расчётах! При таком значении система теряет равновесие. Проверь баланс сил на черновике ещё раз!`;
                
                isAnimating = true;
                animationType = "fail";
                animateProcess();
            }
        });

        // Первичный старт
        loadQuest(currentLevelIdx);
    </script>
</body>
</html>
