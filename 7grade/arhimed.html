<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Живой Лабораторный Стенд: Архимед</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 { color: #0891b2; font-size: 24px; margin-bottom: 5px; text-align: center; }
        
        .progress-bar-container {
            width: 100%;
            max-width: 920px;
            background: #e2e8f0;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .progress-fill {
            height: 100%;
            width: 20%;
            background: #06b6d4;
            transition: width 0.5s ease;
        }

        .formula-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            max-width: 920px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .formula-visual {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Cambria', serif;
            background: #f1f5f9;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            color: #0891b2;
        }
        .formula-desc { font-size: 13px; color: #475569; max-width: 500px; line-height: 1.4; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            justify-content: center;
        }
        .canvas-container { 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        
        .task-panel {
            flex: 1;
            min-width: 350px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        .task-title { font-size: 16px; font-weight: bold; color: #0891b2; }
        .task-text {
            background: #ecfeff;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid #06b6d4;
            font-weight: 500;
            min-height: 110px;
        }
        
        .input-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-box label { font-size: 14px; font-weight: bold; color: #334155; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            color: #0f172a;
            font-size: 20px;
            padding: 8px;
            border-radius: 6px;
            width: 140px;
            text-align: center;
            font-family: monospace;
        }
        input:focus { border-color: #06b6d4; outline: none; }
        .unit { font-size: 18px; font-weight: bold; color: #475569; }

        .btn-action {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            background: #0891b2;
            color: white;
            box-shadow: 0 4px 10px rgba(8,145,178,0.2);
        }
        .btn-action:hover { background: #0e7490; }
        
        .feedback {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            display: none;
            line-height: 1.4;
        }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <h1>📐 Живая физика: Сила Архимеда</h1>
    
    <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="formula-card">
        <div class="formula-visual">F_A = ρ_жид · g · V_погр</div>
        <div class="formula-desc">
            <b>Закон Архимеда:</b> Выталкивающая сила сонаправлена с осью Y вверх. <br>
            Внимательно изучайте графический стенд — все элементы строго соответствуют условиям задач!
        </div>
    </div>

    <div class="container">
        <div class="canvas-container">
            <canvas id="archimedesCanvas" width="460" height="380"></canvas>
        </div>
        <div class="task-panel">
            <div class="task-title" id="levelTitle">Уровень 1 из 5</div>
            <div class="task-text" id="taskLabel">Синхронизация физических моделей...</div>
            
            <div class="input-box">
                <label id="inputLabel">Твой ответ:</label>
                <div class="input-row">
                    <input type="number" id="userAnswer" placeholder="Значение" step="any">
                    <span class="unit" id="unitLabel">Н</span>
                </div>
            </div>

            <button class="btn-action" id="checkBtn">⚡ Проверить моё решение</button>
            <div class="feedback" id="feedbackBlock"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('archimedesCanvas');
        const ctx = canvas.getContext('2d');

        let animationTime = 0; 
        let bodyOffset = 0;    
        let bodyY = 205;       
        
        let gameState = "observing"; 
        let currentTask = null;

        function drawSystem() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const glassX = 130, glassY = 130, glassW = 200, glassH = 200;
            const waterLevelY = glassY + 60; // Линия воды = 190 пикселей
            const dynX = glassX + glassW / 2;
            const bodyW = 70, bodyH = 70;
            
            animationTime += 0.04;
            if (gameState === "observing") {
                bodyOffset = Math.sin(animationTime) * 2.0; 
            } else {
                bodyOffset = 0;
            }

            let currentBX = dynX - bodyW / 2;
            let currentBY = bodyY + bodyOffset;

            // 1. АТМОСФЕРА УРОВНЯ
            if (currentTask && currentTask.level === 3) {
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(40, 40, 2, 2); ctx.fillRect(410, 70, 3, 3); ctx.fillRect(60, 320, 2, 2);
            }

            // 2. ОТРИСОВКА МИКРОВОЛН ЖИДКОСТИ
            ctx.fillStyle = (currentTask && currentTask.level === 3) ? '#22c55e' : '#7dd3fc'; 
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(glassX + 4, glassY + glassH - 4);
            ctx.lineTo(glassX + 4, waterLevelY);
            for (let x = glassX + 4; x <= glassX + glassW - 4; x += 5) {
                let waveY = waterLevelY + Math.sin(x * 0.05 + animationTime) * 1.5;
                ctx.lineTo(x, waveY);
            }
            ctx.lineTo(glassX + glassW - 4, glassY + glassH - 4);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            // 3. СТЕНКИ СТАКАНА
            ctx.strokeStyle = (currentTask && currentTask.level === 3) ? '#94a3b8' : '#475569';
            ctx.lineWidth = 4; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(glassX, glassY); ctx.lineTo(glassX, glassY + glassH); ctx.lineTo(glassX + glassW, glassY + glassH); ctx.lineTo(glassX + glassW, glassY); ctx.stroke();

            // 4. ОСОБАЯ ГРАФИКА ТИПОВ КРЕПЛЕНИЙ
            if (currentTask) {
                if (currentTask.level === 3) {
                    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(dynX, 0); ctx.lineTo(dynX, currentBY); ctx.stroke();
                } else if (currentTask.level === 4) {
                    // Подводные весы на дне стакана
                    let platformY = currentBY + bodyH; // Верхняя грань платформы весов
                    
                    // Рисуем красивые, чётко видимые пружины от дна стакана (330) вверх до платформы
                    drawSpring(glassX + 50, glassY + glassH - 4, platformY + 6);
                    drawSpring(glassX + glassW - 50, glassY + glassH - 4, platformY + 6);
                    
                    // Рисуем саму платформу напольных весов, на которой стоит валун
                    ctx.fillStyle = '#94a3b8'; 
                    ctx.fillRect(currentBX - 15, platformY, bodyW + 30, 6);
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(currentBX - 15, platformY, bodyW + 30, 6);
                } else if (currentTask.level === 5 && gameState !== "fail_anim") {
                    ctx.fillStyle = '#64748b'; ctx.fillRect(dynX - 6, 0, 12, currentBY);
                    ctx.fillStyle = '#475569'; ctx.fillRect(currentBX - 5, currentBY - 6, bodyW + 10, 6);
                }
            }

            // 5. ОТРИСОВКА ТЕЛА (ОБРАЗЕЦ)
            ctx.fillStyle = (currentTask && currentTask.level === 4) ? '#64748b' : '#b45309'; 
            ctx.fillRect(currentBX, currentBY, bodyW, bodyH);
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 2; ctx.strokeRect(currentBX, currentBY, bodyW, bodyH);

            if (currentTask && currentTask.level === 5) {
                ctx.fillStyle = '#f8fafc'; 
                ctx.strokeStyle = '#475569';
                ctx.fillRect(currentBX + 15, currentBY + 15, bodyW - 30, bodyH - 30);
                ctx.strokeRect(currentBX + 15, currentBY + 15, bodyW - 30, bodyH - 30);
            }

            // 6. ОТОБРАЖЕНИЕ ВЕКТОРОВ СИЛ
            let hideSystem = currentTask && currentTask.hide ? currentTask.hide : "";
            
            // А. Сила тяжести
            drawArrow(dynX, currentBY + bodyH / 2, dynX, currentBY + bodyH + 35, '#dc2626', "F_тяж");
            
            // Б. Сила Архимеда
            let faLabel = "F_A = ?";
            if (gameState === "success_anim" && !hideSystem.includes("fa")) {
                faLabel = `F_A = ${currentTask.fa} Н`;
            }
            drawArrow(dynX - 25, currentBY + bodyH / 2, dynX - 25, currentBY - 25, '#0284c7', faLabel);

            // В. Вектор веса тела или силы упора (СТРОГО СОГЛАСНО ФИЗИКЕ)
            if (currentTask.level === 4) {
                // Вектор веса P давит НА ВЕСЫ, то есть направлен строго ВНИЗ из дна бруска!
                let weightLabel = gameState === "success_anim" ? `P_в_воде = ${currentTask.expected} Н` : "P_в_воде = ?";
                
                // Координаты стрелки: начинается на дне бруска (currentBY + bodyH) 
                // и идёт ВНИЗ на 30 пикселей. Текст смещён вправо (+25), чтобы не налезать на параметры бака.
                ctx.strokeStyle = '#16a34a';
                ctx.fillStyle = '#16a34a';
                ctx.lineWidth = 3;
                
                let startArrowY = currentBY + bodyH;
                let endArrowY = startArrowY + 30;
                
                ctx.beginPath(); 
                ctx.moveTo(dynX + 25, startArrowY); 
                ctx.lineTo(dynX + 25, endArrowY); 
                ctx.stroke();
                
                // Рисуем наконечник стрелки, смотрящий ВНИЗ
                ctx.beginPath();
                ctx.moveTo(dynX + 25, endArrowY);
                ctx.lineTo(dynX + 20, endArrowY - 6);
                ctx.lineTo(dynX + 30, endArrowY - 6);
                ctx.fill();
                
                // Подпись вектора (Р_в_воде вместо несуществующей F_тяж_в_воде)
                ctx.font = 'bold 11px sans-serif'; 
                ctx.fillText(weightLabel, dynX + 38, endArrowY - 10);
            } else if (currentTask.level === 5 && gameState !== "fail_anim") {
                // Сила прижимного упора давит на тело сверху вниз
                let holdLabel = gameState === "success_anim" ? `F_упора = ${currentTask.expected} Н` : "F_упора = ?";
                drawArrow(dynX, currentBY - 35, dynX, currentBY, '#16a34a', holdLabel);
            }

            // Параметры среды под стаканом
            ctx.fillStyle = (currentTask && currentTask.level === 3) ? '#f8fafc' : '#0f172a';
            ctx.font = 'bold 11px sans-serif';
            let rhoLabel = hideSystem.includes("rho") ? "ρ_жид = ?" : `ρ_жид = ${currentTask ? currentTask.rho : 0} кг/м³`;
            let vLabel = hideSystem.includes("v") ? "V_тела = ?" : `V_тела = ${currentTask ? currentTask.v : 0} м³`;
            let gLabel = hideSystem.includes("g") ? "g = ?" : `g = ${currentTask ? currentTask.g : 10} Н/кг`;

            ctx.fillText(rhoLabel, glassX + 15, glassY + glassH + 18);
            ctx.fillText(vLabel, glassX + 15, glassY + glassH + 32);
            ctx.fillText(gLabel, glassX + 15, glassY + glassH + 46);
        }

        function drawSpring(x, startY, endY) {
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, startY);
            let turns = 5; let step = (endY - startY) / turns;
            for (let i = 0; i < turns; i++) {
                let sy = startY + i * step;
                ctx.lineTo(x + (i % 2 === 0 ? 6 : -6), sy + step / 2);
            }
            ctx.lineTo(x, endY); ctx.stroke();
        }

        function drawArrow(x1, y1, x2, y2, color, label) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); // ИСПРАВЛЕНО: Теперь строго ctx.stroke()
            let angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - 6 * Math.cos(angle - Math.PI / 6), y2 - 6 * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - 6 * Math.cos(angle + Math.PI / 6), y2 - 6 * Math.sin(angle + Math.PI / 6));
            ctx.fill();
            ctx.font = 'bold 11px sans-serif'; ctx.fillText(label, x2 + 8, y2 + (y2 < y1 ? 10 : -4));
        }
        const questDatabase = [
            {
                level: 1,
                hide: "fa",
                text: "<b>Уровень 1 (Пресная вода):</b> Металлический брусок объёмом V = 0.003 м³ полностью погружен на тросе под воду (ρ = 1000 кг/м³). Какая выталкивающая сила Архимеда действует на этот брусок? (Примите g = 10 Н/кг).",
                inputLabel: "Вычисли силу Архимеда F_A:",
                unit: "Н",
                rho: 1000, v: 0.003, g: 10, fa: 30,
                expected: 30,
                observeY: 205 
            },
            {
                level: 2,
                hide: "fa",
                text: "<b>Уровень 2 (Свободное плавание):</b> Деревянный куб объёмом V = 0.008 м³ свободно плавает на поверхности бака с керосином (ρ = 800 кг/м³), погрузившись в него строго <b>наполовину (1/2 своего объёма)</b>. Чему равна действующая на него сила Архимеда? (Примите g = 10 Н/кг).",
                inputLabel: "Вычисли силу Архимеда при плавании:",
                unit: "Н",
                rho: 800, v: 0.008, g: 10, fa: 32,
                expected: 32,
                observeY: 155 
            },
            {
                level: 3,
                hide: "g fa",
                text: "<b>Уровень 3 (Космический метан):</b> На далёком спутнике исследовательский зонд объёмом V = 0.04 м³ опущен на кабеле в жидкий метан (ρ = 400 кг/м³). Бортовой датчик зафиксировал силу Архимеда, равную F_A = 160 Н. Чему равно <b>ускорение свободного падения g</b> на этой планете?",
                inputLabel: "Вычисли планетарное ускорение g:",
                unit: "Н/кг",
                rho: 400, v: 0.04, g: 10, fa: 160,
                expected: 10,
                observeY: 205
            },
            {
                level: 4,
                hide: "fa",
                text: "<b>Уровень 4 (Подводные весы):</b> Гранитный валун массой m = 40 кг и объёмом V = 0.012 м³ лежит на пружинных весах, установленных на самом дне резервуара с водой (ρ = 1000 кг/м³). Какую силу веса зафиксируют весы? (Примите g = 10 Н/кг).",
                inputLabel: "Рассчитай вес тела в воде:",
                unit: "Н",
                rho: 1000, v: 0.012, g: 10, fa: 120,
                expected: 280,
                observeY: 220 
            },
            {
                level: 5,
                hide: "fa rho v",
                text: "<b>Уровень 5 (Удерживающий упор):</b> Полая стальная деталь массой m = 15 кг и общим наружным объёмом V = 0.025 м³ находится в баке с водой (ρ = 1000 кг/м³). Механический упор давит на неё сверху, удерживая её полностью под водой. Какую силу давления упора нужно приложить?",
                inputLabel: "Вычисли силу прижимного упора сверху:",
                unit: "Н",
                rho: 1000, v: 0.025, g: 10, fa: 250,
                expected: 100,
                observeY: 205
            }
        ];

        let currentLevelIdx = 0;

        function loadQuest(idx) {
            currentTask = questDatabase[idx];
            gameState = "observing";
            
            document.getElementById('progressFill').style.width = ((idx + 1) * 20) + "%";
            document.getElementById('levelTitle').innerText = `Уровень ${currentTask.level} из 5`;
            document.getElementById('taskLabel').innerHTML = currentTask.text;
            document.getElementById('inputLabel').innerText = currentTask.inputLabel;
            document.getElementById('unitLabel').innerText = currentTask.unit;
            
            bodyY = currentTask.observeY;
            
            document.getElementById('userAnswer').value = "";
            document.getElementById('feedbackBlock').style.display = "none";
            document.getElementById('checkBtn').style.display = "block";
            document.getElementById('checkBtn').innerText = "⚡ Проверить моё решение";
        }

        function updateGameLoop() {
            if (gameState === "success_anim") {
                bodyY += (currentTask.observeY - bodyY) * 0.1;
            } else if (gameState === "fail_anim") {
                if (currentTask.level === 5) {
                    bodyY -= 8; 
                    if (bodyY < 20) resetAfterFail();
                } else if (currentTask.level === 4) {
                    bodyY += 5; 
                    if (bodyY > 290) resetAfterFail();
                } else {
                    bodyOffset = (Math.random() - 0.5) * 12; 
                    setTimeout(resetAfterFail, 1000);
                }
            }

            drawSystem();
            requestAnimationFrame(updateGameLoop);
        }

        function resetAfterFail() {
            gameState = "observing";
            bodyY = currentTask.observeY;
            document.getElementById('checkBtn').style.display = "block";
        }

        document.getElementById('checkBtn').addEventListener('click', () => {
            if (gameState !== "observing") return;
            
            const userAns = parseFloat(document.getElementById('userAnswer').value);
            const feed = document.getElementById('feedbackBlock');
            feed.style.display = "block";

            if (isNaN(userAns)) {
                feed.className = "feedback error";
                feed.innerText = "⚠️ Сначала введи числовой ответ в поле!";
                return;
            }

            if (Math.abs(userAns - currentTask.expected) < 0.1) {
                gameState = "success_anim";
                feed.className = "feedback success";
                feed.innerHTML = `🎉 Отлично! Расчёт абсолютно точен. Баланс гидростатики подтверждён!`;
                document.getElementById('checkBtn').style.display = "none";
                
                setTimeout(() => {
                    currentLevelIdx++;
                    if (currentLevelIdx < questDatabase.length) {
                        loadQuest(currentLevelIdx);
                    } else {
                        document.getElementById('taskLabel').innerHTML = "🏆 <b>ПОБЕДА!</b> Ты успешно завершил живой квест по силе Архимеда! Геометрия стендов и векторов теперь идеальна!";
                    }
                }, 2500);
            } else {
                gameState = "fail_anim";
                feed.className = "feedback error";
                feed.innerHTML = `❌ Ошибка в расчётах! Система потеряла равновесие. Проверь формулы на черновике ещё раз!`;
                document.getElementById('checkBtn').style.display = "none";
            }
        });

        loadQuest(currentLevelIdx);
        updateGameLoop();
    </script>
</body>
</html>
