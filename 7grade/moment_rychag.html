<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Живая физика: Правило моментов рычага</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 { color: #0284c7; font-size: 24px; margin-bottom: 5px; text-align: center; }
        
        .progress-bar-container {
            width: 100%;
            max-width: 920px;
            background: #e2e8f0;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .progress-fill {
            height: 100%;
            width: 20%;
            background: #0284c7;
            transition: width 0.5s ease;
        }

        .formula-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            max-width: 920px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }
        .formula-visual {
            font-size: 22px;
            font-weight: bold;
            font-family: 'Cambria', serif;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            color: #0369a1;
        }
        .formula-desc { font-size: 13px; color: #475569; max-width: 500px; line-height: 1.4; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 950px;
            width: 100%;
            justify-content: center;
        }
        .canvas-container { 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        
        .task-panel {
            flex: 1;
            min-width: 350px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        .task-title { font-size: 16px; font-weight: bold; color: #0284c7; }
        .task-text {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid #0284c7;
            font-weight: 500;
            min-height: 110px;
        }
        
        .input-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-box label { font-size: 14px; font-weight: bold; color: #334155; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            color: #0f172a;
            font-size: 20px;
            padding: 8px;
            border-radius: 6px;
            width: 140px;
            text-align: center;
            font-family: monospace;
        }
        input:focus { border-color: #0284c7; outline: none; }
        .unit { font-size: 18px; font-weight: bold; color: #475569; }

        .btn-action {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            background: #0284c7;
            color: white;
            box-shadow: 0 4px 10px rgba(2,132,199,0.2);
        }
        .btn-action:hover { background: #0369a1; }
        
        .feedback {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            display: none;
            line-height: 1.4;
        }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <h1>🧱 Интерактивная Лаборатория: Правило Моментов</h1>
    
    <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="formula-card">
        <div class="formula-visual">F₁ / F₂ = l₂ / l₁</div>
        <div class="formula-visual">M = F · l</div>
        <div class="formula-desc">
            <b>Условие равновесия:</b> Рычаг находится в балансе, когда вращающий момент сил против часовой стрелки равен моменту сил по часовой стрелке.
        </div>
    </div>

    <div class="container">
        <div class="canvas-container">
            <canvas id="leverCanvas" width="460" height="380"></canvas>
        </div>
        <div class="task-panel">
            <div class="task-title" id="levelTitle">Уровень 1 из 5</div>
            <div class="task-text" id="taskLabel">Синхронизация физических стендов...</div>
            
            <div class="input-box">
                <label id="inputLabel">Твой ответ:</label>
                <div class="input-row">
                    <input type="number" id="userAnswer" placeholder="Значение" step="any">
                    <span class="unit" id="unitLabel">м</span>
                </div>
            </div>

            <button class="btn-action" id="checkBtn">⚡ Сбалансировать систему</button>
            <div class="feedback" id="feedbackBlock"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('leverCanvas');
        const ctx = canvas.getContext('2d');

        let animationTime = 0;
        let leverAngle = -0.15;   // Начальный дисбаланс (до ответа качели перекошены!)
        let currentL2Pos = 180;   // Текущая отрисовочная координата X для перемещаемого кубика
        
        let gameState = "observing"; 
        let currentTask = null;

        function drawSystem() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = 220;
            const groundY = 320;
            const pxPerMeter = 28; // Масштаб плеча

            animationTime += 0.04;
            
            // Физический движок реакций углов под состояние ответа
            if (gameState === "observing") {
                // До ответа качели стабильно завалены в сторону перевеса + легкое покачивание
                let baseAngle = (currentTask && currentTask.level === 3) ? 0 : currentTask.startAngle;
                leverAngle = baseAngle + Math.sin(animationTime) * 0.01;
            } else if (gameState === "success_anim") {
                leverAngle += (0 - leverAngle) * 0.08; // Плавный выход в идеальный горизонт
            } else if (gameState === "fail_anim") {
                leverAngle += (currentTask.failAngle - leverAngle) * 0.08; 
            }

            // 1. Окружение площадки
            ctx.fillStyle = '#f0fdfa'; ctx.fillRect(0, 0, canvas.width, groundY);
            ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            // РЕНДЕР СТЕНДОВ КВЕСТА
            if (currentTask && currentTask.level === 3) {
                // --- ПРАВКА №3: АНАТОМИЧЕСКИ ПРАВИЛЬНАЯ ДВЕРЬ ---
                // Ось вращения (петли) слева: centerX - 100
                let doorLeftX = centerX - 100;
                
                ctx.save();
                ctx.translate(doorLeftX, centerY);
                ctx.rotate(leverAngle * 0.3); // Легкий поворот полотна при нажатии

                // Дверное полотно: петли слева, доска уходит направо!
                ctx.fillStyle = '#fef08a'; 
                ctx.fillRect(0, -110, 200, 220);
                ctx.strokeStyle = '#78350f'; ctx.lineWidth = 4;
                ctx.strokeRect(0, -110, 200, 220);

                // Петли крепления (строго слева на торце!)
                ctx.fillStyle = '#475569';
                ctx.fillRect(-6, -80, 6, 20); ctx.fillRect(-6, 60, 6, 20);

                // Дверная ручка: ПРАВИЛЬНО вынесена на противоположный правый край полотна!
                let handleX = currentTask.l1 * pxPerMeter * 6.5; // вынос на край
                ctx.strokeStyle = '#475569'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(handleX - 15, 0); ctx.lineTo(handleX, 0); ctx.stroke();
                ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(handleX, 0, 7, 0, Math.PI*2); ctx.fill();

                // Вектор силы младенца (Появляется только после верного ответа!)
                if (gameState === "success_anim") {
                    drawArrow(handleX, 0, handleX, 50, '#10b981', `F = ${currentTask.f1} Н`);
                } else {
                    drawArrow(handleX, 0, handleX, 35, '#94a3b8', "F = ?");
                }

                // Плечо силы l
                ctx.fillStyle = '#0284c7'; ctx.font = '12px monospace';
                ctx.fillText(`l = ${currentTask.l1} м`, handleX / 2 - 15, -15);
                ctx.restore();

            } else {
                // СТЕНД КАЧЕЛЕЙ ДЛЯ ОСТАЛЬНЫХ ЗАДАЧ
                ctx.fillStyle = '#64748b';
                ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(centerX - 15, groundY); ctx.lineTo(centerX + 15, groundY); ctx.fill();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(leverAngle);

                // Доска качелей
                ctx.strokeStyle = '#b45309'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(-200, 0); ctx.lineTo(200, 0); ctx.stroke();
                
                // Деления метров
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
                for(let m = -180; m <= 180; m += pxPerMeter) {
                    if (m === 0) continue;
                    ctx.beginPath(); ctx.moveTo(m, -3); ctx.lineTo(m, 3); ctx.stroke();
                }

                // Сила 1 (Левая, всегда стабильна)
                drawBoxAndForce(-currentTask.l1 * pxPerMeter, 20, '#ef4444', `F₁=${currentTask.f1}Н`, `l₁=${currentTask.l1}м`, true);

                // УПРАВЛЕНИЕ ДИНАМИКОЙ КУБИКОВ (Правки №1, №2, №4, №5)
                if (currentTask.level === 1 || currentTask.level === 4) {
                    // --- МЕХАНИКА ДЛЯ ПЛЕМЕН (Задачи 1 и 4) ---
                    let targetXPos = currentTask.l2 * pxPerMeter;
                    if (gameState === "success_anim") {
                        // После верного ответа груз плавно подъезжает в точку баланса!
                        currentL2Pos += (targetXPos - currentL2Pos) * 0.05;
                    }
                    
                    let l2Label = gameState === "success_anim" ? `l₂=${currentTask.l2}м` : "l₂ = ?";
                    drawBoxAndForce(currentL2Pos, currentTask.level === 1 ? 28 : 16, '#16a34a', `F₂=${currentTask.f2}Н`, l2Label, true);

                } else if (currentTask.level === 2 || currentTask.level === 5) {
                    // --- МЕХАНИКА ДЛЯ СИЛ (Задачи 2 и 5) ---
                    // Правый груз лежит строго на своём законном месте l2
                    if (currentTask.level === 2) {
                        let showForceArrow = (gameState === "success_anim");
                        let f2Label = showForceArrow ? `F₂=${currentTask.f2}Н` : "F₂ = ?";
                        drawBoxAndForce(currentTask.l2 * pxPerMeter, 18, showForceArrow ? '#16a34a' : '#94a3b8', f2Label, `l₂=${currentTask.l2}м`, showForceArrow);
                    } else if (currentTask.level === 5) {
                        // Олимпиадный уровень: 3 груза
                        drawBoxAndForce(currentTask.l2 * pxPerMeter, 15, '#3b82f6', `F₂=${currentTask.f2}Н`, `l₂=${currentTask.l2}м`, true);
                        
                        let showForceArrow = (gameState === "success_anim");
                        let f3Label = showForceArrow ? `F₃=${currentTask.f3}Н` : "F₃ = ?";
                        drawBoxAndForce(currentTask.l3 * pxPerMeter, 12, showForceArrow ? '#10b981' : '#94a3b8', f3Label, `l₃=${currentTask.l3}м`, showForceArrow);
                    }
                }

                ctx.restore();
            }

            // Информационный подвал
            ctx.fillStyle = '#0f172a'; ctx.font = 'bold 11px sans-serif';
            ctx.fillText(`Лаборатория моментов: Стенд активен`, 20, groundY + 25);
        }

        function drawBoxAndForce(x, boxSize, color, fText, lText, drawVector) {
            ctx.fillStyle = color;
            ctx.fillRect(x - boxSize/2, -boxSize - 3, boxSize, boxSize);
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.strokeRect(x - boxSize/2, -boxSize - 3, boxSize, boxSize);

            // Стрелка вектора силы (рисуется яркой или серой/пустой до ответа)
            if (drawVector) {
                drawArrow(x, -boxSize/2, x, 45, color, fText);
            } else {
                drawArrow(x, -boxSize/2, x, 30, '#94a3b8', fText); // серый пунктирный набросок
            }

            // Текст плеча над кубиком
            ctx.fillStyle = '#475569'; ctx.font = 'bold 10px sans-serif';
            ctx.fillText(lText, x - 14, -boxSize - 8);
        }

        function drawArrow(x1, y1, x2, y2, color, label) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            let angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - 6 * Math.cos(angle - Math.PI / 6), y2 - 6 * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - 6 * Math.cos(angle + Math.PI / 6), y2 - 6 * Math.sin(angle + Math.PI / 6));
            ctx.fill();
            ctx.font = 'bold 11px sans-serif'; ctx.fillText(label, x2 + 6, y2 + (y2 < y1 ? 12 : -4));
        }
        // Конфигурация 5 уровней согласно новым строгим требованиям интерактива
        const questDatabase = [
            {
                level: 1,
                hide: "l2",
                text: "<b>Уровень 1 (Качели-балансир):</b> На левом краю качелей на расстоянии l₁ = 4 м сел мальчик весом F₁ = 200 Н. Справа садится мужчина весом F₂ = 800 Н. На каком расстоянии l₂ от центра опоры должен сесть мужчина, чтобы качели пришли в идеальный горизонтальный баланс?",
                inputLabel: "Вычисли плечо силы l₂:",
                unit: "м",
                f1: 200, l1: 4, f2: 800, l2: 1, 
                expected: 1, 
                startAngle: -0.15, failAngle: -0.22, // Мальчик перевешивает до ответа
                initL2Pos: 180 // Стартовая позиция кубика мужчины — на самом краю!
            },
            {
                level: 2,
                hide: "f2",
                text: "<b>Уровень 2 (Поиск неизвестной силы):</b> К левому плечу рычага длиной l₁ = 3 м подвешен груз весом F₁ = 100 Н. Справа на расстоянии l₂ = 1.5 м закреплен пустой подвес. Какую силу F₂ необходимо приложить к этому подвесу, чтобы удержать рычаг в равновесии?",
                inputLabel: "Вычисли удерживающую силу F₂:",
                unit: "Н",
                f1: 100, l1: 3, f2: 200, l2: 1.5, 
                expected: 200, 
                startAngle: -0.15, failAngle: -0.25, // До ответа силы нет, левая сторона упала
                initL2Pos: 42 // Груз сразу стоит на 1.5м (1.5 * 28 = 42)
            },
            {
                level: 3,
                hide: "work", 
                text: "<b>Уровень 3 (Правило моментов двери):</b> На ручку двери, расположенную на расстоянии l = 0.8 м от дверных петель (оси вращения), младенец нажимает рукой. Вычислите вращающий <b>момент силы М</b>, который создаёт ребёнок, если его сила равна F = 10 Н.",
                inputLabel: "Вычисли момент силы M (Н·м):",
                unit: "Н·м",
                f1: 10, l1: 0.8, expected: 8, 
                startAngle: 0, failAngle: 0.01 
            },
            {
                level: 4,
                hide: "l2",
                text: "<b>Уровень 4 (Переход от массы кирпича):</b> На левое плечо рычага длиной l₁ = 2 м положили блок массой m₁ = 6 кг. На каком расстоянии l₂ от центра опоры нужно положить второй груз массой m₂ = 2 кг, чтобы рычаг выровнялся? (Примите g = 10 Н/кг).",
                inputLabel: "Вычисли плечо силы l₂:",
                unit: "м",
                f1: 60, l1: 2, f2: 20, l2: 6, 
                expected: 6, 
                startAngle: -0.15, failAngle: -0.25,
                initL2Pos: 180 // Груз m2 лежит на самом краю (180px), создавая жесткий перекос
            },
            {
                level: 5,
                hide: "f",
                text: "<b>Уровень 5 (Баланс трёх сил):</b> Слева от опоры на плече l₁ = 2 м висит груз F₁ = 300 Н. Справа на расстоянии l₂ = 1 м закреплен груз F₂ = 200 Н. Какую силу F₃ нужно приложить к самому правому краю рычага (l₃ = 4 м), чтобы восстановить баланс?",
                inputLabel: "Вычисли компенсирующую силу F₃:",
                unit: "Н",
                f1: 300, l1: 2, f2: 200, l2: 1, f3: 100, l3: 4, 
                expected: 100, 
                startAngle: -0.12, failAngle: -0.22,
                initL2Pos: 112 // l3 зафиксирован на 4м (4 * 28 = 112)
            }
        ];

        let currentLevelIdx = 0;

        function loadQuest(idx) {
            currentTask = questDatabase[idx];
            gameState = "observing";
            
            document.getElementById('progressFill').style.width = ((idx + 1) * 20) + "%";
            document.getElementById('levelTitle').innerText = `Уровень ${currentTask.level} из 5`;
            document.getElementById('taskLabel').innerHTML = currentTask.text;
            document.getElementById('inputLabel').innerText = currentTask.inputLabel;
            document.getElementById('unitLabel').innerText = currentTask.unit;
            
            leverAngle = currentTask.startAngle;
            
            // Загружаем стартовую позицию перемещаемого кубика (если он есть в условиях)
            if (currentTask.initL2Pos !== undefined) {
                currentL2Pos = currentTask.initL2Pos;
            }
            
            document.getElementById('userAnswer').value = "";
            document.getElementById('feedbackBlock').style.display = "none";
            document.getElementById('checkBtn').style.display = "block";
            document.getElementById('checkBtn').innerText = "⚡ Сбалансировать систему";
        }

        function updateGameLoop() {
            if (gameState === "success_anim") {
                // Выравнивание рычага в идеальный 0
                leverAngle += (0 - leverAngle) * 0.06;
            } else if (gameState === "fail_anim") {
                leverAngle += (currentTask.failAngle - leverAngle) * 0.06;
                if (Math.abs(leverAngle - currentTask.failAngle) < 0.01) {
                    setTimeout(resetAfterFail, 1500);
                }
            }

            drawSystem();
            requestAnimationFrame(updateGameLoop);
        }

        function resetAfterFail() {
            gameState = "observing";
            if (currentTask.initL2Pos !== undefined) {
                currentL2Pos = currentTask.initL2Pos;
            }
            document.getElementById('checkBtn').style.display = "block";
        }

        document.getElementById('checkBtn').addEventListener('click', () => {
            if (gameState !== "observing") return;
            
            const userAns = parseFloat(document.getElementById('userAnswer').value);
            const feed = document.getElementById('feedbackBlock');
            feed.style.display = "block";

            if (isNaN(userAns)) {
                feed.className = "feedback error";
                feed.innerText = "⚠️ Сначала введите числовой ответ!";
                return;
            }

            if (Math.abs(userAns - currentTask.expected) < 0.1) {
                gameState = "success_anim";
                feed.className = "feedback success";
                feed.innerHTML = `🎉 Абсолютно верно! Условие равновесия плеч и моментов выполнено.`;
                document.getElementById('checkBtn').style.display = "none";
                
                setTimeout(() => {
                    currentLevelIdx++;
                    if (currentLevelIdx < questDatabase.length) {
                        loadQuest(currentLevelIdx);
                    } else {
                        document.getElementById('taskLabel').innerHTML = "🏆 <b>ПОЛНАЯ ПОБЕДА!</b> Ты успешно подчинил себе правило моментов! Двери, рычаги и системы сил теперь в идеальном балансе!";
                    }
                }, 3500);
            } else {
                gameState = "fail_anim";
                feed.className = "feedback error";
                feed.innerHTML = `❌ Дисбаланс моментов! Момент слева не равен моменту справа, система опрокинулась. Пересчитай пропорцию!`;
                document.getElementById('checkBtn').style.display = "none";
            }
        });

        loadQuest(currentLevelIdx);
        updateGameLoop();
    </script>
</body>
</html>
