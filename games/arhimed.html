<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физический Лабиринт: Сила Архимеда</title>
    <style>
        :root {
            --brand-dark: #1A252C;
            --brand-teal: #0D6066;
            --brand-gray: #F4F6F7;
            --brand-alert: #8C2D19;
            --brand-success: #1E6B38;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--brand-dark);
            color: var(--brand-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        #game-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ПОЛЕ ЛАБИРИНТА - Выровненные границы без вылетов */
        #canvas-container {
            width: 900px;
            height: 300px;
            position: relative;
            background-color: #ffffff;
            border: 4px solid var(--brand-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Шарик с жесткими границами */
        #player-ball {
            width: 30px;
            height: 30px;
            background-color: transparent;
            border: 3.5px solid #000000;
            border-radius: 50%;
            position: absolute;
            left: 35px;
            top: 60px;
            transform: translate(-50%, -50%);
            transition: left 0.45s linear, top 0.45s linear, 
                        width 0.4s ease, height 0.4s ease;
            z-index: 10;
            box-sizing: border-box;
        }

        /* Карточка панели задач */
        #control-panel {
            width: 900px;
            background-color: #151e24;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 20px;
            padding: 20px;
            box-sizing: border-box;
        }
        #task-text {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .action-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .num-input {
            background-color: var(--brand-dark);
            border: 2px solid var(--brand-teal);
            color: white;
            padding: 10px 12px;
            font-size: 16px;
            border-radius: 4px;
            width: 140px;
            font-weight: bold;
            outline: none;
        }
        .submit-btn {
            background-color: var(--brand-teal);
            color: white;
            border: none;
            padding: 11px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover { background-color: #117880; }
        #info-msg { font-size: 14px; font-weight: bold; margin-top: 10px; min-height: 20px; }
        .text-success { color: var(--brand-success); }
        .text-alert { color: var(--brand-alert); }
    </style>
</head>
<body>

    <div id="game-title">Лабиринт сред</div>

    <div id="canvas-container">
        <svg viewBox="0 0 900 300">
            <!-- Четыре физические среды, распределенные ровно от x=0 -->
            <rect x="0" y="0" width="225" height="300" fill="rgba(91, 192, 222, 0.13)" />
            <rect x="225" y="0" width="225" height="300" fill="rgba(140, 45, 25, 0.08)" />
            <rect x="450" y="0" width="225" height="300" fill="rgba(30, 107, 56, 0.08)" />
            <rect x="675" y="0" width="225" height="300" fill="rgba(13, 96, 102, 0.13)" />

            <!-- Тексты названий сред -->
            <text x="15" y="25" fill="#2b7a94" font-size="11" font-family="sans-serif" font-weight="bold">1. Пресная вода (1000 кг/м³)</text>
            <text x="240" y="25" fill="#8C2D19" font-size="11" font-family="sans-serif" font-weight="bold">2. Машинное масло (900 кг/м³)</text>
            <text x="465" y="25" fill="#1E6B38" font-size="11" font-family="sans-serif" font-weight="bold">3. Солёная рапа (1200 кг/м³)</text>
            <text x="690" y="25" fill="#0D6066" font-size="11" font-family="sans-serif" font-weight="bold">4. Тяжёлый сироп (1400 кг/м³)</text>

            <text x="15" y="90" fill="#8C2D19" font-size="13" font-family="sans-serif" font-weight="bold">Старт</text>
            <text x="815" y="175" fill="#1E6B38" font-size="13" font-family="sans-serif" font-weight="bold">Финиш</text>

            <!-- ВЕКТОРНЫЕ СТЕНЫ ЛАБИРИНТА (Толщина 10px) -->
            <!-- Первая стена между отсеками 1 и 2 (Нижняя лунка для прохода) -->
            <rect x="220" y="0" width="10" height="220" fill="#000000" />
            
            <!-- Центральный излом: Дорисован и изменён по вашему зелёному эскизу -->
            <rect x="445" y="0" width="10" height="110" fill="#000000" /> <!-- Левый верхний упор -->
            <rect x="445" y="100" width="200" height="10" fill="#000000" /> <!-- Продлённый вправо козырёк -->
            <rect x="530" y="100" width="10" height="100" fill="#000000" /> <!-- Короткий правый аппендикс стены -->
            <rect x="445" y="170" width="10" height="130" fill="#000000" /> <!-- Новая длинная вертикальная стена до самого дна -->

            <!-- Третья стена между 3 и 4 отсеками (Верхняя лунка) -->
            <rect x="675" y="90" width="10" height="210" fill="#000000" />
            
            <!-- Финальные ворота перед финишем -->
            <rect x="885" y="0" width="10" height="130" fill="#000000" />
            <rect x="885" y="195" width="10" height="105" fill="#000000" />
        </svg>

        <div id="player-ball"></div>
    </div>

    <!-- ИНТЕРФЕЙС УПРАВЛЕНИЯ -->
    <div id="control-panel">
        <div id="task-text">
            <b>Отсек 1 (Пресная вода, ρ = 1000 кг/м³):</b><br>
            Для прохождения первого створа на сплошной <b>медный шарик (плотность меди 8900 кг/м³)</b> должна действовать выталкивающая сила Архимеда, равная 200 Н. Каким должен быть объём этого шарика в литрах, чтобы получить такую силу? (Прими g = 10 Н/кг).
        </div>
        <div class="action-area">
            <input type="number" class="num-input" id="answer-field" placeholder="Ответ">
            <button class="submit-btn" onclick="verifyMove()">Ввод ответа</button>
        </div>
        <div id="info-msg"></div>
    </div>
    <script>
        // Координаты траектории полностью пересчитаны под новые стены и безопасную высоту y=235
        const pathAnimation = [
            // ЭТАП 1: Идет вправо -> опускается в лунку (y=235) -> заходит во второй отсек
            [
                {x: 110, y: 60, size: 30},
                {x: 110, y: 235, size: 30},
                {x: 225, y: 235, size: 20}, // Проход лунки 1
                {x: 300, y: 235, size: 20}  // Фиксация во 2 отсеке (Не проваливается под поле!)
            ],
            // ЭТАП 2: Поднимается вверх -> огибает козырёк сверху -> спускается вниз перед длинной новой стеной
            [
                {x: 300, y: 155, size: 20},
                {x: 300, y: 60, size: 20},  
                {x: 495, y: 60, size: 20},  // Движение над козырьком
                {x: 495, y: 245, size: 20}, // Спуск строго вниз перед новой зелёной стеной
                {x: 600, y: 245, size: 45}  // Проход под изломом и фиксация в 3 отсеке (Раздулся!)
            ],
            // ЭТАП 3: Поднимается вертикально вверх в 3 отсеке -> проходит над третьей стеной (x=675)
            [
                {x: 600, y: 55, size: 45},  
                {x: 715, y: 55, size: 30},  // Проход лунки 3 (Сжался!)
                {x: 790, y: 55, size: 30}   // Фиксация в 4 отсеке
            ],
            // ЭТАП 4: Спускается к центральному финальному створу и выходит на Финиш
            [
                {x: 790, y: 165, size: 30}, 
                {x: 890, y: 165, size: 25}  // Финиш за рамками лабиринта
            ]
        ];

        const taskScenarios = [
            {
                answer: 20,
                nextTask: "<b>Отсек 2 (Машинное масло, ρ = 900 кг/м³):</b><br>Для продолжения движения по траектории сплошной <b>стальной шарик (плотность стали 7800 кг/м³)</b> настраивают на фиксированный объём 0.05 м³. Вычисли модуль силы Архимеда в Ньютонах, которая будет выталкивать его в масле. (g = 10 Н/кг)."
            },
            {
                answer: 450,
                nextTask: "<b>Отсек 3 (Солёная рапа, ρ = 1200 кг/м³):</b><br>На сплошной <b>алюминиевый шарик (плотность алюминия 2700 кг/м³)</b> действует сила Архимеда, равная 360 Н. Вычисли его искомый объём в кубических метрах (м³), чтобы успешно пройти верхний поворот трассы."
            },
            {
                answer: 0.03,
                nextTask: "<b>Отсек 4 (Тяжёлый сироп, ρ = 1400 кг/м³):</b><br>Сплошной <b>свинцовый шарик (плотность свинца 11300 кг/м³)</b> сжался до объёма 0.02 м³. Какая выталкивающая сила Архимеда в Ньютонах действует на него перед финишным створом?"
            },
            {
                answer: 280,
                nextTask: "<b>Лабиринт сред успешно пройден!</b><br>Все расчёты по закону Архимеда выполнены абсолютно верно. Ученик проигнорировал ловушки с плотностью материалов тел и использовал только параметры жидкостей."
            }
        ];

        let currentStage = 0;

        function verifyMove() {
            const userVal = parseFloat(document.getElementById('answer-field').value);
            const msg = document.getElementById('info-msg');
            const target = taskScenarios[currentStage].answer;

            if (Math.abs(userVal - target) < 0.001) {
                msg.className = "text-success";
                msg.innerHTML = "✓ Расчет верный! Шарик меняет габариты и огибает стены строго по заданной траектории.";
                
                // Запуск последовательного перекатывания по точкам эскиза
                animateBallPath(pathAnimation[currentStage], 0, () => {
                    if (currentStage < taskScenarios.length - 1) {
                        document.getElementById('task-text').innerHTML = taskScenarios[currentStage].nextTask;
                        document.getElementById('answer-field').value = "";
                        msg.innerHTML = "";
                        currentStage++;
                    } else {
                        document.getElementById('task-text').innerHTML = taskScenarios[currentStage].nextTask;
                        document.querySelector('.action-area').style.display = 'none';
                        msg.innerHTML = "";
                    }
                });
            } else {
                msg.className = "text-alert";
                msg.innerHTML = "❌ Ошибка в расчетах! Шарик застревает или сталкивается со стенами отсеков.";
            }
        }

        function animateBallPath(points, index, onComplete) {
            if (index >= points.length) {
                if (onComplete) onComplete();
                return;
            }

            const ball = document.getElementById('player-ball');
            ball.style.left = points[index].x + 'px';
            ball.style.top = points[index].y + 'px';
            ball.style.width = points[index].size + 'px';
            ball.style.height = points[index].size + 'px';

            setTimeout(() => {
                animateBallPath(points, index + 1, onComplete);
            }, 500);
        }
    </script>
</body>
</html>
