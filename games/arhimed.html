<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архимед-Лабиринт</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; display: flex; flex-direction: column; align-items: center; }
        #game-container { position: relative; width: 600px; height: 400px; background: #e0f2fe; border: 4px solid #0284c7; overflow: hidden; }
        .obstacle { position: absolute; background: #0369a1; }
        /* Верхнее препятствие */
        #obs1 { top: 0; left: 200px; width: 40px; height: 250px; } 
        /* Нижнее препятствие */
        #obs2 { bottom: 0; left: 400px; width: 40px; height: 250px; }
        
        #target { position: absolute; right: 20px; top: 20px; width: 50px; height: 50px; background: #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; }
        #ball { position: absolute; left: 20px; bottom: 20px; background: #ef4444; border-radius: 50%; transition: width 0.2s, height 0.2s; }
        
        #controls { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 570px; }
        .ui-row { margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
        button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

    <h2>Лабиринт Архимеда: Доведи шарик до лунки</h2>
    <p>Управляй силой Архимеда, меняя радиус шарика. Сила тяжести постоянна (50 Н).</p>

    <div id="game-container">
        <div id="obs1" class="obstacle"></div>
        <div id="obs2" class="obstacle"></div>
        <div id="target">ЛУНКА</div>
        <div id="ball"></div>
    </div>

    <div id="controls">
        <div class="ui-row">
            <label for="radius-slider">Радиус шарика (R): </label>
            <input type="range" id="radius-slider" min="10" max="35" value="15">
            <span id="radius-val">15</span> см
        </div>
        <div class="ui-row">
            <div>Объем ($V \sim R^3$): <span id="volume-val">3.37</span> дм³</div>
            <div style="margin-left: 20px;">Сила Архимеда ($F_А = \rho g V$): <b id="fa-val">33.7</b> Н</div>
        </div>
        <div class="ui-row">
            <button onclick="startSimulation()">Запуск движения ➔</button>
            <button onclick="resetGame()" style="background: #64748b;">Сброс</button>
            <span id="status" style="font-weight: bold; color: #0369a1;"></span>
        </div>
    </div>

    <script>
        // Физические константы для игры
        const F_gravity = 50; // Постоянная сила тяжести шарика (в Ньютонах)
        const rho_water = 1;  // Плотность воды для простоты расчетов
        const g = 10;

        let ballX = 20;
        let ballY = 20; // от дна
        let radius = 15;
        let isMoving = false;
        let animationFrame;

        const ballEl = document.getElementById('ball');
        const slider = document.getElementById('radius-slider');

        function updateBallSize() {
            radius = parseInt(slider.value);
            document.getElementById('radius-val').innerText = radius;
            
            // Считаем объем (для простоты как R^3 / 1000, чтобы перевести в условные дм3)
            let volume = (Math.pow(radius, 3) / 1000).toFixed(2);
            document.getElementById('volume-val').innerText = volume;
            
            // F = rho * g * V
            let F_archimedes = (rho_water * g * volume).toFixed(1);
            document.getElementById('fa-val').innerText = F_archimedes;

            ballEl.style.width = (radius * 2) + 'px';
            ballEl.style.height = (radius * 2) + 'px';
            updatePosition();
        }

        function updatePosition() {
            ballEl.style.left = ballX + 'px';
            ballEl.style.bottom = ballY + 'px';
        }

        slider.addEventListener('input', () => {
            if (!isMoving) updateBallSize();
        });

        function startSimulation() {
            if (isMoving) return;
            isMoving = true;
            document.getElementById('status').innerText = "Шарик движется...";
            animate();
        }

        function animate() {
            if (!isMoving) return;

            // Расчет сил в реальном времени
            let volume = Math.pow(radius, 3) / 1000;
            let F_archimedes = rho_water * g * volume;
            
            // Результирующая сила вверх/вниз
            let netForceY = F_archimedes - F_gravity;
            
            // Шарик катится вправо автоматически
            ballX += 2; 
            // Движение по вертикали зависит от баланса сил (ускорение для залипательности)
            ballY += netForceY * 0.1; 

            // Ограничения стенок (пол и потолок)
            if (ballY < 0) ballY = 0;
            if (ballY > 400 - (radius * 2)) ballY = 400 - (radius * 2);

            updatePosition();

            // Проверка столкновения с препятствиями
            // Препятствие 1 (сверху)
            if (ballX + radius*2 > 200 && ballX < 240) {
                let currentTopY = 400 - ballY - radius*2;
                if (currentTopY < 250) { // врезался
                    gameOver("Бабах! Шарик слишком высоко и врезался в верхнюю перегородку!");
                    return;
                }
            }
            // Препятствие 2 (снизу)
            if (ballX + radius*2 > 400 && ballX < 440) {
                if (ballY < 250) { // врезался
                    gameOver("Бабах! Шарик слишком низко и врезался в нижнюю перегородку!");
                    return;
                }
            }

            // Проверка победы (добрался до правого края)
            if (ballX >= 530 && ballY > 300) {
                gameOver("Ура! Гол! Вы идеально рассчитали силу Архимеда!", true);
                return;
            } else if (ballX >= 560) {
                gameOver("Мимо лунки! Вы улетели не туда.");
                return;
            }

            animationFrame = requestAnimationFrame(animate);
        }

        function gameOver(message, isWin = false) {
            isMoving = false;
            cancelAnimationFrame(animationFrame);
            document.getElementById('status').innerText = message;
            document.getElementById('status').style.color = isWin ? "#16a34a" : "#dc2626";
        }

        function resetGame() {
            isMoving = false;
            cancelAnimationFrame(animationFrame);
            ballX = 20;
            ballY = 20;
            document.getElementById('status').innerText = "";
            updateBallSize();
        }

        // Инициализация
        updateBallSize();
    </script>
</body>
</html>
