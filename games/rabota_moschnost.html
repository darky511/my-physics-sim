<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический погрузчик: Работа и Мощность</title>
    <style>
        :root {
            --brand-dark: #1A252C;
            --brand-teal: #0D6066;
            --brand-gray: #F4F6F7;
            --brand-alert: #8C2D19;
            --brand-success: #1E6B38;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--brand-dark);
            color: var(--brand-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        #game-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ИГРОВОЙ ЭКРАН */
        #arena {
            width: 800px;
            height: 250px;
            background: linear-gradient(to bottom, #111e25, #060b0e);
            border: 4px solid var(--brand-teal);
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Платформа космодрома */
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background-color: #2c3e50;
            border-top: 3px solid #34495e;
        }

        /* Наш робот-погрузчик */
        #robot-truck {
            width: 70px;
            height: 40px;
            background-color: #f1c40f;
            border: 3px solid #d35400;
            border-radius: 6px;
            position: absolute;
            left: 50px;
            bottom: 40px;
            transition: left 1.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 11px;
        }

        /* Груз, который мы тащим или поднимаем */
        #cargo-box {
            width: 40px;
            height: 40px;
            background-color: #e67e22;
            border: 3px solid #d35400;
            border-radius: 4px;
            position: absolute;
            left: 125px;
            bottom: 40px;
            transition: left 1.5s ease-in-out, bottom 1.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }

        /* Ракета на финише */
        #rocket {
            width: 60px;
            height: 120px;
            background-color: #ecf0f1;
            border: 3px solid #bdc3c7;
            border-radius: 30px 30px 5px 5px;
            position: absolute;
            right: 60px;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .rocket-window {
            width: 20px;
            height: 20px;
            background-color: #3498db;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        /* Индикаторы текущего состояния физических величин */
        .telemetry {
            position: absolute;
            top: 15px;
            left: 20px;
            background-color: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            border-left: 3px solid var(--brand-teal);
        }

        /* Панель управления */
        #control-panel {
            width: 800px;
            background-color: #151e24;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        #task-text {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .action-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .num-input {
            background-color: var(--brand-dark);
            border: 2px solid var(--brand-teal);
            color: white;
            padding: 10px 12px;
            font-size: 16px;
            border-radius: 4px;
            width: 140px;
            font-weight: bold;
            outline: none;
        }

        .submit-btn {
            background-color: var(--brand-teal);
            color: white;
            border: none;
            padding: 11px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .submit-btn:hover { background-color: #117880; }
        #info-msg { font-size: 14px; font-weight: bold; margin-top: 10px; min-height: 20px; }
        .text-success { color: var(--brand-success); }
        .text-alert { color: var(--brand-alert); }
    </style>
</head>
<body>

    <div id="game-title">Робот-погрузчик: Квест «Работа и Мощность»</div>

    <!-- ИГРОВОЙ ЭКРАН С СИМУЛЯЦИЕЙ -->
    <div id="arena">
        <div class="telemetry" id="telemetry-display">Текущий режим: Транспортировка груза</div>
        
        <!-- Объекты на сцене -->
        <div id="robot-truck">РОБОТ</div>
        <div id="cargo-box">📦</div>
        
        <div id="rocket">
            <div class="rocket-window"></div>
            <span style="color:#000; font-size:10px; font-weight:bold;">🚀</span>
        </div>
        
        <div id="ground"></div>
    </div>

    <!-- ИНТЕРФЕЙС КВЕСТА -->
    <div id="control-panel">
        <div id="task-text">
            <b>Задание 1 (Вычисление Работы):</b><br>
            Робот толкает ящик к ракете с постоянной силой 50 Н. Он переместил его на расстояние 4 метра. Какую механическую работу в Джоулях (Дж) совершил робот?
        </div>
        <div class="action-area">
            <input type="number" class="num-input" id="answer-field" placeholder="Ответ в Дж">
            <button class="submit-btn" onclick="checkQuestAnswer()">Подтвердить</button>
        </div>
        <div id="info-msg"></div>
    </div>
    <script>
        // Сценарий квеста: 4 простых шага без закрученных формулировок
        const questStages = [
            {
                // Шаг 1: Робот подъезжает к ящику и толкает его вперед
                robotX: 550, cargoX: 620, cargoY: 40,
                answer: 200, // 50 Н * 4 м = 200 Дж
                telemetry: "Текущий режим: Загрузка в отсек ракеты",
                nextTask: "<b>Задание 2 (Вычисление Силы через Работу):</b><br>Теперь нужно затащить ящик по вертикальному пандусу внутрь ракеты. Робот совершил работу 600 Дж, подняв ящик вертикально вверх на высоту 3 метра. С какой силой в Ньютонах (Н) робот тянул ящик вверх?"
            },
            {
                // Шаг 2: Ящик поднимается вверх на уровень люка ракеты
                robotX: 550, cargoX: 690, cargoY: 120,
                answer: 200, // 600 Дж / 3 м = 200 Н
                telemetry: "Текущий режим: Проверка мощности генератора",
                nextTask: "<b>Задание 3 (Вычисление Мощности):</b><br>Ящик внутри! Робот переходит в режим ожидания. На закрытие бронелюка ракеты его мотор потратил 2 секунды, совершив при этом работу 800 Дж. Чему равна мощность мотора робота в Ваттах (Вт)?"
            },
            {
                // Шаг 3: Робот отъезжает назад, люк готов
                robotX: 100, cargoX: 690, cargoY: 120,
                answer: 400, // 800 Дж / 2 с = 400 Вт
                telemetry: "Текущий режим: Расчет времени до старта",
                nextTask: "<b>Задание 4 (Вычисление Времени через Мощность):</b><br>Финальный запуск топливных насосов! Насос работает со стабильной мощностью 500 Вт. Чтобы полностью заправить баки, ему необходимо совершить работу 4000 Дж. Сколько секунд (с) займет этот процесс?"
            },
            {
                // Шаг 4: Финал, ракета улетает вверх
                robotX: 100, cargoX: 690, cargoY: 400, // Ящик улетает вместе с ракетой вверх за экран
                answer: 8, // 4000 Дж / 500 Вт = 8 секунд
                telemetry: "МИССИЯ ВЫПОЛНЕНА!",
                nextTask: "<b>Ракета успешно запущена в космос!</b>"
            }
        ];

        let currentStageIndex = 0;

        function checkQuestAnswer() {
            const userInputValue = parseFloat(document.getElementById('answer-field').value);
            const messageLabel = document.getElementById('info-msg');
            const currentStageData = questStages[currentStageIndex];

            // Проверка численного ответа
            if (Math.abs(userInputValue - currentStageData.answer) < 0.001) {
                messageLabel.className = "text-success";
                messageLabel.innerHTML = "✓ Абсолютно верно! Параметры приняты. Механизм приведён в действие.";
                
                // Передвигаем робота и груз на экране
                document.getElementById('robot-truck').style.left = currentStageData.robotX + 'px';
                document.getElementById('cargo-box').style.left = currentStageData.cargoX + 'px';
                document.getElementById('cargo-box').style.bottom = currentStageData.cargoY + 'px';
                
                // Если это финал — запускаем ракету вверх
                if (currentStageIndex === 3) {
                    document.getElementById('rocket').style.transition = "bottom 2.5s ease-in";
                    document.getElementById('rocket').style.bottom = "400px";
                }

                // Переключаем на следующее задание
                setTimeout(() => {
                    if (currentStageIndex < questStages.length - 1) {
                        document.getElementById('telemetry-display').innerText = currentStageData.telemetry;
                        document.getElementById('task-text').innerHTML = currentStageData.nextTask;
                        document.getElementById('answer-field').value = "";
                        
                        // Меняем плейсхолдер подсказки единиц измерения
                        const placeholders = ["Ответ", "Ответ в Н", "Ответ в Вт", "Ответ в секундах"];
                        document.getElementById('answer-field').placeholder = placeholders[currentStageIndex + 1];
                        
                        messageLabel.innerHTML = "";
                        currentStageIndex++;
                    } else {
                        // Квест полностью завершен
                        document.getElementById('telemetry-display').innerText = currentStageData.telemetry;
                        document.getElementById('task-text').innerHTML = currentStageData.nextTask;
                        document.querySelector('.action-area').style.display = 'none';
                        messageLabel.innerHTML = "";
                    }
                }, 2000);

            } else {
                messageLabel.className = "text-alert";
                messageLabel.innerHTML = "❌ Ошибка в расчете. Робот заклинило! Проверь формулу на черновике.";
            }
        }
    </script>
</body>
</html>
