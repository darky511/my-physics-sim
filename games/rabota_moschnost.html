<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр: Работа и Мощность в логистике</title>
    <style>
        :root {
            --brand-dark: #1A252C;
            --brand-teal: #0D6066;
            --brand-gray: #F4F6F7;
            --brand-alert: #8C2D19;
            --brand-success: #1E6B38;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--brand-dark);
            color: var(--brand-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        #game-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ИГРОВОЙ КОНТЕЙНЕР (SVG-основа) */
        #canvas-container {
            width: 900px;
            height: 350px;
            position: relative;
            background-color: #ffffff;
            border: 4px solid var(--brand-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Перемещаемый ящик с грузом (коричневый квадрат строго по эскизу) */
        #cargo-box {
            width: 26px;
            height: 26px;
            background-color: #b87333;
            border: 2px solid #5c3a21;
            border-radius: 3px;
            position: absolute;
            left: 35px;
            top: 285px; /* Исходная Точка 1 на земле */
            transform: translate(-50%, -50%);
            transition: left 0.5s linear, top 0.5s linear;
            z-index: 10;
            box-sizing: border-box;
        }

        /* Панель управления и условий задач */
        #control-panel {
            width: 900px;
            background-color: #151e24;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 20px;
            padding: 20px;
            box-sizing: border-box;
        }
        #task-text {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .action-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .num-input {
            background-color: var(--brand-dark);
            border: 2px solid var(--brand-teal);
            color: white;
            padding: 10px 12px;
            font-size: 16px;
            border-radius: 4px;
            width: 140px;
            font-weight: bold;
            outline: none;
        }
        .submit-btn {
            background-color: var(--brand-teal);
            color: white;
            border: none;
            padding: 11px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover { background-color: #117880; }
        #info-msg { font-size: 14px; font-weight: bold; margin-top: 10px; min-height: 20px; }
        .text-success { color: var(--brand-success); }
        .text-alert { color: var(--brand-alert); }
    </style>
</head>
<body>

    <div id="game-title">Логистический комплекс: Механическая Работа и Мощность</div>

    <!-- ВЕКТОРНОЕ ОКНО СИМУЛЯЦИИ -->
    <div id="canvas-container">
        <svg viewBox="0 0 900 350">
            <!-- Земля / Дорога (Серая линия внизу) -->
            <line x1="0" y1="300" x2="900" y2="300" stroke="#b0b0b0" stroke-width="4" />

            <!-- Здание 1 (Черный контур прямоугольника по эскизу) -->
            <rect x="200" y="150" width="150" height="150" fill="none" stroke="#000000" stroke-width="4" />
            
            <!-- Здание 2 (Более высокое черное здание справа) -->
            <rect x="480" y="80" width="200" height="220" fill="none" stroke="#000000" stroke-width="4" />

            <!-- Маркеры Точек (Точки 1-6) и Старт/Финиш строго по позициям платформ -->
            <text x="20" y="255" fill="#8C2D19" font-size="12" font-family="sans-serif" font-weight="bold">Старт</text>
            <text x="20" y="320" fill="#666" font-size="11" font-family="sans-serif">Точка 1</text>
            
            <text x="165" y="320" fill="#666" font-size="11" font-family="sans-serif">Точка 2</text>
            <text x="160" y="135" fill="#666" font-size="11" font-family="sans-serif">Точка 3</text>
            
            <text x="360" y="135" fill="#666" font-size="11" font-family="sans-serif">Точка 4</text>
            <text x="430" y="65" fill="#666" font-size="11" font-family="sans-serif">Точка 5</text>
            
            <text x="690" y="65" fill="#666" font-size="11" font-family="sans-serif">Точка 6</text>
            <text x="680" y="45" fill="#1E6B38" font-size="12" font-family="sans-serif" font-weight="bold">Финиш</text>
        </svg>

        <!-- Ящик с грузом (Позиционируется поверх схемы) -->
        <div id="cargo-box"></div>
    </div>

    <!-- ИНТЕРФЕЙС ЗАДАЧИ -->
    <div id="control-panel">
        <div id="task-text">
            <b>Этап 1 (От точки 1 до точки 2):</b><br>
            Ящик перемещают горизонтально по земле на расстояние 6 метров. Сила трения, преодолеваемая при движении, составляет 40 Н. Какую механическую работу в Джоулях (Дж) необходимо совершить для этого перемещения?
        </div>
        <div class="action-area">
            <input type="number" class="num-input" id="answer-field" placeholder="Ответ в Дж">
            <button class="submit-btn" onclick="verifyLogisticsMove()">Отправить ответ</button>
        </div>
        <div id="info-msg"></div>
    </div>
    <script>
        // Координаты путевых точек строго по геометрии чертежа (с учетом габаритов ящика)
        const logisticsPath = [
            // ЭТАП 1: Движение по горизонтали от Точки 1 к Точке 2
            [
                {x: 185, y: 285}
            ],
            // ЭТАП 2: Вертикальный подъём на крышу первого здания (Точка 2 -> Точка 3)
            [
                {x: 185, y: 135}, // Сначала поднимается вверх
                {x: 215, y: 135}  // Встает на левый угол крыши (Точка 3)
            ],
            // ЭТАП 3: Горизонтальное движение по конвейеру первого здания (Точка 3 -> Точка 4)
            [
                {x: 335, y: 135}  // Перемещается на правый угол крыши (Точка 4)
            ],
            // ЭТАП 4: Перемещение подъёмным краном по вертикали и горизонтали (Точка 4 -> Точка 5)
            [
                {x: 335, y: 65},  // Кран поднимает вертикально вверх на уровень второй крыши
                {x: 495, y: 65}   // Кран смещает горизонтально на левый угол второй крыши (Точка 5)
            ],
            // ЭТАП 5: Движение по верхнему конвейеру второго здания до Финиша (Точка 5 -> Точка 6)
            [
                {x: 665, y: 65}   // Достигает зоны разгрузки Финиш (Точка 6)
            ]
        ];

        // Задачи КИМ ФИПИ без усложненных формулировок
        const warehouseTasks = [
            {
                answer: 240, // 40 Н * 6 м = 240 Дж
                nextTask: "<b>Этап 2 (От точки 2 до точки 3):</b><br>Ящик массой 15 кг поднимают вертикально вверх на крышу первого здания высотой 4 метра. Чему равна работа, совершаемая против силы тяжести при этом подъёме? (Прими g = 10 Н/кг)."
            },
            {
                answer: 600, // 15 кг * 10 Н/кг * 4 м = 600 Дж
                nextTask: "<b>Этап 3 (От точки 3 до точки 4):</b><br>На крыше здания расположен горизонтальный конвейер. Он обладает постоянной механической мощностью 40 Вт. Какое время в секундах (с) потребуется конвейеру, чтобы совершить работу, равную 320 Дж?"
            },
            {
                answer: 8, // 320 Дж / 40 Вт = 8 с
                nextTask: "<b>Этап 4 (От точки 4 до точки 5):</b><br>Подъёмный кран перемещает ящик на крышу второго здания. Кран совершил вертикальную работу подъёма 900 Дж и горизонтальную работу перемещения 400 Дж. Чему равна общая (суммарная) механическая работа, выполненная краном?"
            },
            {
                answer: 1300, // 900 + 400 = 1300 Дж
                nextTask: "<b>Этап 5 (От точки 5 до точки 6):</b><br>Верхний конвейер перемещает ящик до Финиша за 5 секунд, совершая при этом механическую работу 450 Дж. Какова рабочая мощность этого конвейера в Ваттах (Вт)?"
            },
            {
                answer: 90, // 450 Дж / 5 с = 90 Вт
                nextTask: "<b>Логистический трек успешно пройден!</b><br>Ученик закрепил на практике все типы задач на работу (горизонтальную, вертикальную и суммарную) и мощность механизмов, наглядно сопоставляя формулы с типом движения груза."
            }
        ];

        let currentStageIndex = 0;

        function verifyLogisticsMove() {
            const userInputValue = parseFloat(document.getElementById('answer-field').value);
            const msgLabel = document.getElementById('info-msg');
            const targetAnswer = warehouseTasks[currentStageIndex].answer;

            if (Math.abs(userInputValue - targetAnswer) < 0.001) {
                msgLabel.className = "text-success";
                msgLabel.innerHTML = "✓ Верно! Роботы и конвейеры запустили перемещение груза.";
                
                // Запуск последовательной анимации перемещения ящика по точкам текущего этапа
                animateCargoPath(logisticsPath[currentStageIndex], 0, () => {
                    if (currentStageIndex < warehouseTasks.length - 1) {
                        document.getElementById('task-text').innerHTML = warehouseTasks[currentStageIndex].nextTask;
                        document.getElementById('answer-field').value = "";
                        
                        // Динамически меняем плейсхолдеры единиц измерения в инпуте
                        const metricPlaceholders = ["Ответ в Дж", "Ответ в секундах", "Ответ в Дж", "Ответ в Вт"];
                        document.getElementById('answer-field').placeholder = metricPlaceholders[currentStageIndex];
                        
                        msgLabel.innerHTML = "";
                        currentStageIndex++;
                    } else {
                        document.getElementById('task-text').innerHTML = warehouseTasks[currentStageIndex].nextTask;
                        document.querySelector('.action-area').style.display = 'none';
                        msgLabel.innerHTML = "";
                    }
                });
            } else {
                msgLabel.className = "text-alert";
                msgLabel.innerHTML = "❌ Неверно! Системы автоматизации заблокированы. Перепроверь формулу на черновике.";
            }
        }

        // Аниматор последовательного скольжения ящика по углам зданий
        function animateCargoPath(points, index, onComplete) {
            if (index >= points.length) {
                if (onComplete) onComplete();
                return;
            }

            const box = document.getElementById('cargo-box');
            box.style.left = points[index].x + 'px';
            box.style.top = points[index].y + 'px';

            setTimeout(() => {
                animateCargoPath(points, index + 1, onComplete);
            }, 600); // Тайминг шага перемещения
        }
    </script>
</body>
</html>
