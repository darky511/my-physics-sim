<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 <title>Что такое масса? Мера инертности 3D</title>
 <style>
 html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #05070f; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; touch-action: none; position: fixed; }
 #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
 
 .ui-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 420px; background: rgba(11, 17, 32, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 24px; padding: 16px 20px; box-sizing: border-box; z-index: 10; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); color: #fff; }
 .ui-title { font-size: 16px; font-weight: 700; margin: 0 0 4px 0; text-align: center; color: #38bdf8; letter-spacing: -0.3px; }
 .ui-subtitle { font-size: 11px; color: #94a3b8; margin: 0 0 12px 0; text-align: center; line-height: 1.4; }
 
 .slider-container { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
 .slider-label { display: flex; justify-content: space-between; font-size: 11px; color: #f1f5f9; font-weight: 500; }
 input[type=range] { -webkit-appearance: none; width: 100%; background: rgba(255,255,255,0.15); height: 6px; border-radius: 3px; outline: none; }
 input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #38bdf8; cursor: pointer; box-shadow: 0 0 10px #38bdf8; }
 
 .btn-kick { width: 100%; background: #38bdf8; color: #05070f; border: none; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
 .btn-kick:active { background: #0ea5e9; transform: scale(0.98); }
 
 .stats-overlay { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; display: flex; justify-content: space-between; gap: 12px; z-index: 10; pointer-events: none; }
 .stat-box { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 16px; flex: 1; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
 .stat-box.tennis { border-left: 4px solid #a3e635; box-shadow: inset 5px 0 10px -5px rgba(163,230,53,0.3); }
 .stat-box.iron { border-left: 4px solid #cbd5e1; box-shadow: inset 5px 0 10px -5px rgba(203,213,225,0.3); }
 .stat-name { font-size: 11px; color: #414F63; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
 .stat-val { font-size: 13px; font-weight: 700; color: #fff; margin-top: 3px; }
 .stat-speed { font-size: 13px; font-weight: 700; color: #38bdf8; margin-top: 1px; }
 </style>
</head>
<body>

 <div class="stats-overlay">
 <div class="stat-box tennis">
 <div class="stat-name">Теннисный мяч</div>
 <div class="stat-val">Масса: 0.05 кг</div>
 <div class="stat-speed" id="speedTennis">Скорость: 0 м/с</div>
 </div>
 <div class="stat-box iron">
 <div class="stat-name">Чугунное ядро</div>
 <div class="stat-val">Масса: 50 кг</div>
 <div class="stat-speed" id="speedIron">Скорость: 0 м/с</div>
 </div>
 </div>

 <div id="canvas-container"></div>

 <div class="ui-panel">
 <div class="ui-title">Масса — мера «лени» тела</div>
 <div class="ui-subtitle" id="experimentDesc">В невесомости веса нет, но масса осталась! Толкните объекты одной силой: посмотрите, кто из них окажется бóльшим "лентяем".</div>
 <div class="slider-container">
 <div class="slider-label">
 <span>Сила толчка (Ньютоны)</span>
 <span id="forceVal">150 Н</span>
 </div>
 <input type="range" id="forceSlider" min="10" max="400" step="10" value="150">
 </div>
 <button class="btn-kick" id="kickBtn">ТОЛКНУТЬ СИЛОЙ ЩЕЛЧКА!</button>
 </div>

 <script>
 const container = document.getElementById('canvas-container');
 const canvas = document.createElement('canvas');
 container.appendChild(canvas);
 const ctx = canvas.getContext('2d');
 
 let width = canvas.width = window.innerWidth;
 let height = canvas.height = window.innerHeight;

 // ПРИБЛИЖАЕМ КАМЕРУ ДЛЯ УВЕЛИЧЕНИЯ ОБЪЕКТОВ
 let dynamicFov = width < height ? 320 : 480; 
 let responsiveOffsetY = width < height ? (height * 0.15) : (height * 0.02);

 window.addEventListener('resize', () => {
 width = canvas.width = window.innerWidth;
 height = canvas.height = window.innerHeight;
 dynamicFov = width < height ? 320 : 480;
 responsiveOffsetY = width < height ? (height * 0.15) : (height * 0.02);
 });

 // РАДИУС УВЕЛИЧЕН (с 5.5 до 100). Шары станут по-настоящему огромными!
 const balls = {
 tennis: { x: -20, y: 11, z: 0, vx: 0, radius: 100, mass: 0.05, color: '#a3e635', label: 'Теннисный мяч' },
 iron: { x: -20, y: -9, z: 0, vx: 0, radius: 100, mass: 50.0, color: '#e2e8f0', label: 'Чугунное ядро' }
 };

 let kickForce = 150;
 let stars = [];
 for(let i=0; i<80; i++) {
 stars.push({ x: (Math.random()-0.5)*160, y: (Math.random()-0.5)*120, z: (Math.random()-0.5)*100 });
 }

 const slider = document.getElementById('forceSlider');
 const forceVal = document.getElementById('forceVal');
 const kickBtn = document.getElementById('kickBtn');
 const expDesc = document.getElementById('experimentDesc');

 slider.addEventListener('input', (e) => {
 kickForce = parseInt(e.target.value);
 forceVal.innerText = kickForce + " Н";
 });

 document.addEventListener('touchmove', (e) => {
 if (e.target.id === 'forceSlider' || e.target.id === 'kickBtn') return;
 e.preventDefault();
 }, { passive: false });

 function project(x, y, z) {
 let cameraDist = 65;
 let denominator = z + cameraDist;
 if (denominator <= 0) denominator = 1;
 let scale = dynamicFov / denominator;
 return {
 x: width / 2 + x * scale,
 y: height / 2 - y * scale - responsiveOffsetY,
 scale: scale,
 visible: true
 };
 }
 // Логика толчка (Второй закон Ньютона: Ускорение = Сила / Масса)
 kickBtn.addEventListener('click', () => {
 // Если шары улетели далеко — возвращаем их на стартовую позицию
 if (balls.tennis.x > 15 || balls.iron.x > -19) {
 balls.tennis.x = -20;
 balls.iron.x = -20;
 }
 
 // Считаем скорость по формуле импульса: v = (F * t) / m (при t = 0.04с)
 balls.tennis.vx = (kickForce * 0.04) / balls.tennis.mass;
 balls.iron.vx = (kickForce * 0.04) / balls.iron.mass;

 // Ограничиваем графическую скорость мяча для плавности отображения на мониторе
 if (balls.tennis.vx > 1.4) balls.tennis.vx = 1.4;
 
 expDesc.innerHTML = "<b>Пошел импульс!</b> Легкий мяч набрал огромную скорость. Тяжелое ядро проявило свою <i>инертную лень</i> — при той же силе его огромную массу почти невозможно сдвинуть!";
 
 setTimeout(() => {
 expDesc.innerText = "В невесомости веса нет, но масса осталась! Толкните объекты одной силой: посмотрите, кто из них окажется бóльшим \"лентяем\".";
 }, 6000);
 });

 const speedTennisTxt = document.getElementById('speedTennis');
 const speedIronTxt = document.getElementById('speedIron');

 function updatePhysics() {
 balls.tennis.x += balls.tennis.vx;
 balls.iron.x += balls.iron.vx;

 // Плавное торможение в глубоком космосе при вылете за границы трека
 if (balls.tennis.x > 35) balls.tennis.vx *= 0.96;
 if (balls.iron.x > 35) balls.iron.vx *= 0.96;

 if (balls.tennis.vx === 0) {
 speedTennisTxt.innerText = "Скорость: 0 м/с";
 speedIronTxt.innerText = "Скорость: 0 м/с";
 } else {
 // Честный физический вывод скоростей в м/с
 speedTennisTxt.innerText = "Скорость: " + ((kickForce * 0.04) / balls.tennis.mass).toFixed(1) + " м/с";
 speedIronTxt.innerText = "Скорость: " + ((kickForce * 0.04) / balls.iron.mass).toFixed(2) + " м/с";
 }
 }

 // ЦИКЛ РЕНДЕРИНГА
 function animate() {
 requestAnimationFrame(animate);
 updatePhysics();

 // Глубокий темный космос
 ctx.fillStyle = '#DFE3F5';
 ctx.fillRect(0, 0, width, height);

 // 1. ЗВЕЗДНЫЙ ФОН
 ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
 stars.forEach(star => {
 let p2d = project(star.x, star.y, star.z);
 ctx.beginPath();
 ctx.arc(p2d.x, p2d.y, 0.7 * (p2d.scale / 10), 0, Math.PI * 2);
 ctx.fill();
 });

 // 2. КОНТРАСТНЫЕ НЕОНОВЫЕ НАПРАВЛЯЮЩИЕ (Ярко выделяются на фоне)
 ctx.lineWidth = 2.5;
 
 // Яркий трек для теннисного мяча
 ctx.strokeStyle = 'rgba(7, 5, 71, 0.4)';
 ctx.beginPath();
 let startLine1 = project(-25, 11, 0);
 let endLine1 = project(28, 11, 0);
 ctx.moveTo(startLine1.x, startLine1.y);
 ctx.lineTo(endLine1.x, endLine1.y);
 ctx.stroke();

 // Яркий трек для чугунного ядра
 ctx.strokeStyle = 'rgba(7, 5, 71, 0.4)';
 ctx.beginPath();
 let startLine2 = project(-25, -9, 0);
 let endLine2 = project(28, -9, 0);
 ctx.moveTo(startLine2.x, startLine2.y);
 ctx.lineTo(endLine2.x, endLine2.y);
 ctx.stroke();

 // Светящаяся линия ЛАЗЕРНОГО СТАРТА (Красный неон)
 ctx.strokeStyle = '#ef4444';
 ctx.lineWidth = 3;
 ctx.shadowBlur = 15;
 ctx.shadowColor = '#ef4444';
 ctx.beginPath();
 let laserTop = project(-20, 18, 0);
 let laserBottom = project(-20, -16, 0);
 ctx.moveTo(laserTop.x, laserTop.y);
 ctx.lineTo(laserBottom.x, laserBottom.y);
 ctx.stroke();
 
 // Сброс размытия для остальных элементов
 ctx.shadowBlur = 0;

 // 3. ОТРИСОВКА КРУПНЫХ ОБЪЕКТОВ ОДИНАКОВОГО ВИЗУАЛЬНОГО РАЗМЕРА
 // Рендерим Теннисный мяч
 let t2d = project(balls.tennis.x, balls.tennis.y, balls.tennis.z);
 let tRadius = balls.tennis.radius * (t2d.scale / 40); // Скорректирован коэффициент под гигантский радиус
 
 // Объемный сочный градиент для мяча
 ctx.beginPath();
 ctx.arc(t2d.x, t2d.y, tRadius, 0, Math.PI * 2);
 let tGrad = ctx.createRadialGradient(t2d.x - tRadius*0.3, t2d.y - tRadius*0.3, tRadius*0.05, t2d.x, t2d.y, tRadius);
 tGrad.addColorStop(0, '#f4fbf0');
 tGrad.addColorStop(0.2, '#ccf381');
 tGrad.addColorStop(0.6, '#a3e635');
 tGrad.addColorStop(1, '#3f6212');
 ctx.fillStyle = tGrad;
 ctx.fill();

 // Рендерим Чугунное ядро
 let i2d = project(balls.iron.x, balls.iron.y, balls.iron.z);
 let iRadius = balls.iron.radius * (i2d.scale / 40);

 // Объемный металлический градиент для ядра
 ctx.beginPath();
 ctx.arc(i2d.x, i2d.y, iRadius, 0, Math.PI * 2);
 let iGrad = ctx.createRadialGradient(i2d.x - iRadius*0.3, i2d.y - iRadius*0.3, iRadius*0.05, i2d.x, i2d.y, iRadius);
 iGrad.addColorStop(0, '#f8fafc');
 iGrad.addColorStop(0.2, '#cbd5e1');
 iGrad.addColorStop(0.6, '#475569');
 iGrad.addColorStop(1, '#0f172a');
 ctx.fillStyle = iGrad;
 ctx.fill();

 // Контрастные текстовые подписи над шарами (смещены выше, чтобы не заходить на огромные сферы)
 ctx.fillStyle = '#ffffff';
 ctx.font = 'bold 14px sans-serif';
 ctx.textAlign = 'center';
 ctx.fillText(balls.tennis.label, t2d.x, t2d.y - tRadius - 12);
 ctx.fillText(balls.iron.label, i2d.x, i2d.y - iRadius - 12);
 }

 animate();
 </script>
</body>
</html>
