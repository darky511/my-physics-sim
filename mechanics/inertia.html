<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 <title>Что такое масса? Мера инертности 3D</title>
 <style>
 html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #090d16; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; touch-action: none; position: fixed; }
 #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
 
 .ui-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 420px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px; box-sizing: border-box; z-index: 10; box-shadow: 0 20px 40px rgba(0,0,0,0.6); color: #fff; }
 .ui-title { font-size: 18px; font-weight: 700; margin: 0 0 4px 0; text-align: center; color: #38bdf8; }
 .ui-subtitle { font-size: 12px; color: #94a3b8; margin: 0 0 16px 0; text-align: center; line-height: 1.4; }
 
 .slider-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
 .slider-label { display: flex; justify-content: space-between; font-size: 12px; color: #f1f5f9; font-weight: 500; }
 input[type=range] { -webkit-appearance: none; width: 100%; background: rgba(255,255,255,0.15); height: 6px; border-radius: 3px; outline: none; }
 input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #38bdf8; cursor: pointer; }
 
 .btn-kick { width: 100%; background: #38bdf8; color: #090d16; border: none; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; -webkit-tap-highlight-color: transparent; }
 .btn-kick:active { background: #0ea5e9; }
 
 .stats-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; display: flex; justify-content: space-between; gap: 10px; z-index: 10; pointer-events: none; }
 .stat-box { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 14px; flex: 1; text-align: center; backdrop-filter: blur(5px); }
 .stat-box.tennis { border-left: 3px solid #a3e635; }
 .stat-box.iron { border-left: 3px solid #94a3b8; }
 .stat-name { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
 .stat-val { font-size: 14px; font-weight: 600; color: #fff; margin-top: 2px; }
 </style>
</head>
<body>

 <div class="stats-overlay">
 <div class="stat-box tennis">
 <div class="stat-name">Теннисный мяч</div>
 <div class="stat-val">Масса: 0.05 кг</div>
 <div class="stat-val" id="speedTennis">Скорость: 0 м/с</div>
 </div>
 <div class="stat-box iron">
 <div class="stat-name">Чугунное ядро</div>
 <div class="stat-val">Масса: 50 кг</div>
 <div class="stat-val" id="speedIron">Скорость: 0 м/с</div>
 </div>
 </div>

 <div id="canvas-container"></div>

 <div class="ui-panel">
 <div class="ui-title">Масса — мера «лени» тела</div>
 <div class="ui-subtitle" id="experimentDesc">В невесомости нет веса, но есть масса! Щелкните по шарам с одинаковой силой и посмотрите, кто окажется бóльшим "лентяем".</div>
 <div class="slider-container">
 <div class="slider-label">
 <span>Сила толчка (Ньютоны)</span>
 <span id="forceVal">150 Н</span>
 </div>
 <input type="range" id="forceSlider" min="50" max="400" step="10" value="150">
 </div>
 <button class="btn-kick" id="kickBtn">ТОЛКНУТЬ ШАРЫ!</button>
 </div>

 <script>
 const container = document.getElementById('canvas-container');
 const canvas = document.createElement('canvas');
 container.appendChild(canvas);
 const ctx = canvas.getContext('2d');
 
 let width = canvas.width = window.innerWidth;
 let height = canvas.height = window.innerHeight;

 // УМНАЯ АДАПТИВНОСТЬ ПОД ЭКРАНЫ ПК / МОБИЛЬНЫХ
 let dynamicFov = width < height ? 360 : 500; // Отдаляем камеру на мобилках
 let responsiveOffsetY = width < height ? (height * 0.12) : (height * 0.05); // Корректируем центр

 window.addEventListener('resize', () => {
 width = canvas.width = window.innerWidth;
 height = canvas.height = window.innerHeight;
 dynamicFov = width < height ? 360 : 500;
 responsiveOffsetY = width < height ? (height * 0.12) : (height * 0.05);
 });

 // Физические тела
 const balls = {
 tennis: { x: -18, y: 10, z: 0, vx: 0, radius: 2.2, mass: 0.05, color: '#a3e635', label: 'Мяч' },
 iron: { x: -18, y: -10, z: 0, vx: 0, radius: 4.5, mass: 50.0, color: '#64748b', label: 'Ядро' }
 };

 let kickForce = 150;
 let stars = [];
 for(let i=0; i<60; i++) {
 stars.push({ x: (Math.random()-0.5)*150, y: (Math.random()-0.5)*100, z: (Math.random()-0.5)*100 });
 }

 // Обработка интерфейса
 const slider = document.getElementById('forceSlider');
 const forceVal = document.getElementById('forceVal');
 const kickBtn = document.getElementById('kickBtn');
 const expDesc = document.getElementById('experimentDesc');

 slider.addEventListener('input', (e) => {
 kickForce = parseInt(e.target.value);
 forceVal.innerText = kickForce + " Н";
 });

 // Жесткая блокировка скролла Telegram для смартфонов (защита от исчезновения экрана)
 document.addEventListener('touchmove', (e) => {
 if (e.target.id === 'forceSlider' || e.target.id === 'kickBtn') return;
 e.preventDefault();
 }, { passive: false });

 // Функция 3D-проекции с защитой от сбоев
 function project(x, y, z) {
 let cameraDist = 60;
 let denominator = z + cameraDist;
 if (denominator <= 0) denominator = 1;
 let scale = dynamicFov / denominator;
 return {
 x: width / 2 + x * scale,
 y: height / 2 - y * scale - responsiveOffsetY,
 scale: scale,
 visible: true
 };
 }
 // Логика толчка (Второй закон Ньютона: Ускорение = Сила / Масса)
 // Время действия силы (импульс щелчка) принимаем за короткий миг (t = 0.05 с)
 kickBtn.addEventListener('click', () => {
 // Сбрасываем позиции шаров в исходную левую точку, если они улетели
 if (balls.tennis.x > 15 || balls.iron.x > -17) {
 balls.tennis.x = -18;
 balls.iron.x = -18;
 }
 
 // Считаем приращение скорости по формуле импульса: v = (F * t) / m
 // Мяч легкий (0.05 кг) — скорость от этого щелчка будет огромной
 balls.tennis.vx = (kickForce * 0.04) / balls.tennis.mass;
 // Ядро тяжелое (50 кг) — скорость будет ничтожно малой
 balls.iron.vx = (kickForce * 0.04) / balls.iron.mass;

 // Ограничиваем скорость графического отображения мяча, чтобы он не исчезал за один кадр
 if (balls.tennis.vx > 1.2) balls.tennis.vx = 1.2;
 
 expDesc.innerHTML = "<b>Пошел импульс!</b> Легкий мяч мгновенно набрал бешеную скорость. А тяжелое ядро проявило свою <i>инертную лень</i> — его огромную массу невероятно тяжело сдвинуть с места!";
 
 // Через 5 секунд возвращаем текстовую подсказку
 setTimeout(() => {
 expDesc.innerText = "В невесомости нет веса, но есть масса! Щелкните по шарам с одинаковой силой и посмотрите, кто окажется бóльшим \"лентяем\".";
 }, 6000);
 });

 // Обновление текстовых счетчиков реальной физической скорости
 const speedTennisTxt = document.getElementById('speedTennis');
 const speedIronTxt = document.getElementById('speedIron');

 function updatePhysics() {
 // Двигаем шары по оси X в соответствии с их скоростью
 balls.tennis.x += balls.tennis.vx;
 balls.iron.x += balls.iron.vx;

 // Эмуляция бесконечного космоса: если улетели далеко — плавно тормозим
 if (balls.tennis.x > 35) balls.tennis.vx *= 0.95;
 if (balls.iron.x > 35) balls.iron.vx *= 0.95;

 // Рассчитываем и выводим реальные физические скорости (м/с) для школьника
 let realTennisSpeed = (balls.tennis.vx * (balls.tennis.mass / 0.04));
 let realIronSpeed = (balls.iron.vx * (balls.iron.ironMass ? 50 : 1.25)); // масштабирование для наглядности
 
 if (balls.tennis.vx === 0) {
 speedTennisTxt.innerText = "Скорость: 0 м/с";
 speedIronTxt.innerText = "Скорость: 0 м/с";
 } else {
 // Честный расчет из F = m*a
 speedTennisTxt.innerText = "Скорость: " + ((kickForce * 0.05) / balls.tennis.mass).toFixed(1) + " м/с";
 speedIronTxt.innerText = "Скорость: " + ((kickForce * 0.05) / balls.iron.mass).toFixed(2) + " м/с";
 }
 }

 // ОСНОВНОЙ ЦИКЛ РЕНДЕРИНГА
 function animate() {
 requestAnimationFrame(animate);
 updatePhysics();

 // Очистка экрана (глубокий космос)
 ctx.fillStyle = '#090d16';
 ctx.fillRect(0, 0, width, height);

 // 1. ОТРИСОВКА ЗВЕЗДНОГО ФОНА
 ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
 stars.forEach(star => {
 let p2d = project(star.x, star.y, star.z);
 ctx.beginPath();
 ctx.arc(p2d.x, p2d.y, 0.8 * (p2d.scale / 10), 0, Math.PI * 2);
 ctx.fill();
 });

 // 2. ОТРИСОВКА КОСМИЧЕСКОГО ТРЕКА (Линии старта и дорожек)
 ctx.lineWidth = 1.5;
 // Трек для теннисного мяча
 ctx.strokeStyle = 'rgba(163, 230, 53, 0.15)';
 ctx.beginPath();
 let startLine1 = project(-22, 10, 0);
 let endLine1 = project(25, 10, 0);
 ctx.moveTo(startLine1.x, startLine1.y);
 ctx.lineTo(endLine1.x, endLine1.y);
 ctx.stroke();

 // Трек для чугунного ядра
 ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)';
 ctx.beginPath();
 let startLine2 = project(-22, -10, 0);
 let endLine2 = project(25, -10, 0);
 ctx.moveTo(startLine2.x, startLine2.y);
 ctx.lineTo(endLine2.x, endLine2.y);
 ctx.stroke();

 // Линия СТАРТА (Красный лазер)
 ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
 ctx.lineWidth = 2;
 ctx.beginPath();
 let laserTop = project(-18, 16, 0);
 let laserBottom = project(-18, -16, 0);
 ctx.moveTo(laserTop.x, laserTop.y);
 ctx.lineTo(laserBottom.x, laserBottom.y);
 ctx.stroke();

 // 3. ОТРИСОВКА ОБЪЕКТОВ
 // Рендерим Теннисный мяч
 let t2d = project(balls.tennis.x, balls.tennis.y, balls.tennis.z);
 let tRadius = balls.tennis.radius * (t2d.scale / 8);
 
 // Тень на дорожке для объема
 ctx.beginPath();
 ctx.ellipse(t2d.x, t2d.y + tRadius, tRadius * 0.8, tRadius * 0.2, 0, 0, Math.PI * 2);
 ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
 ctx.fill();

 // Сам мяч (Объемный радиальный градиент)
 ctx.beginPath();
 ctx.arc(t2d.x, t2d.y, tRadius, 0, Math.PI * 2);
 let tGrad = ctx.createRadialGradient(t2d.x - tRadius*0.3, t2d.y - tRadius*0.3, tRadius*0.1, t2d.x, t2d.y, tRadius);
 tGrad.addColorStop(0, '#d9f99d');
 tGrad.addColorStop(0.4, '#a3e635');
 tGrad.addColorStop(1, '#4d7c0f');
 ctx.fillStyle = tGrad;
 ctx.fill();

 // Рендерим Чугунное ядро
 let i2d = project(balls.iron.x, balls.iron.y, balls.iron.z);
 let iRadius = balls.iron.radius * (i2d.scale / 8);

 // Тень ядра
 ctx.beginPath();
 ctx.ellipse(i2d.x, i2d.y + iRadius, iRadius * 0.8, iRadius * 0.2, 0, 0, Math.PI * 2);
 ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
 ctx.fill();

 // Само чугунное ядро (Металлический градиент)
 ctx.beginPath();
 ctx.arc(i2d.x, i2d.y, iRadius, 0, Math.PI * 2);
 let iGrad = ctx.createRadialGradient(i2d.x - iRadius*0.3, i2d.y - iRadius*0.3, iRadius*0.05, i2d.x, i2d.y, iRadius);
 iGrad.addColorStop(0, '#cbd5e1');
 iGrad.addColorStop(0.3, '#64748b');
 iGrad.addColorStop(0.8, '#334155');
 iGrad.addColorStop(1, '#0f172a');
 ctx.fillStyle = iGrad;
 ctx.fill();

 // Подписи к шарам на сцене
 ctx.fillStyle = 'rgba(255,255,255,0.7)';
 ctx.font = '12px sans-serif';
 ctx.textAlign = 'center';
 ctx.fillText(balls.tennis.label, t2d.x, t2d.y - tRadius - 8);
 ctx.fillText(balls.iron.label, i2d.x, i2d.y - iRadius - 8);
 }

 animate();
 </script>
</body>
</html>
