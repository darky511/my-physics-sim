<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Давление: Твердые тела, Жидкости, Газы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none; /* Prevent text selection while dragging */
        }

        .app-container { display: flex; height: 100%; width: 100%; }
        
        .simulation-area {
            flex-grow: 1;
            position: relative;
            background: linear-gradient(to bottom, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; cursor: default; }
        canvas.grabbing { cursor: grabbing; }
        canvas.pointer { cursor: pointer; }

        .sidebar {
            width: 420px;
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            z-index: 20;
        }

        /* Custom Controls */
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px; background: #334155; 
            border-radius: 5px; outline: none; margin-top: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; 
            background: #3b82f6; cursor: pointer; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .mode-btn {
            background: #1e293b; border: 1px solid #334155; color: #94a3b8;
            padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; text-align: left; display: flex; align-items: center; gap: 12px;
        }
        .mode-btn:hover { background: #334155; color: white; }
        .mode-btn.active {
            background: #2563eb; border-color: #3b82f6; color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .formula-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid #fbbf24;
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }

        /* CSS-only Math styling */
        .math-fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 5px;
            font-size: 1.2em;
        }
        .math-num { border-bottom: 2px solid white; padding: 0 5px 2px 5px; }
        .math-den { padding: 2px 5px 0 5px; }
        .math-var { font-weight: bold; color: #fbbf24; }

        @media (max-width: 1024px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 50%; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 1rem; }
            .simulation-area { height: 50%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Simulation Canvas -->
    <div class="simulation-area" id="simContainer">
        <canvas id="simCanvas"></canvas>
        <div class="absolute top-6 left-0 w-full text-center pointer-events-none select-none z-10">
            <h1 class="text-3xl md:text-4xl font-bold text-white drop-shadow-lg">Физика Давления</h1>
            <p class="text-slate-300 text-sm mt-2 max-w-lg mx-auto opacity-90 bg-black/20 rounded-full py-1 px-4 backdrop-blur-sm inline-block">
                Переключайте режимы, чтобы увидеть разницу между твердыми телами, жидкостями и газами.
            </p>
        </div>
    </div>

    <!-- Sidebar Controls -->
    <div class="sidebar">
        <div>
            <h2 class="text-xl font-bold text-white mb-1">Режимы</h2>
            <p class="text-xs text-slate-400">Выберите тип давления для изучения</p>
        </div>

        <!-- Mode Buttons -->
        <div class="grid grid-cols-1 gap-2">
            <button id="btn-solid" class="mode-btn active" onclick="setMode('solid')">
                <span class="text-xl">🧱</span>
                <div><div class="text-sm font-bold">Твердые тела</div><div class="text-[10px] opacity-70">Зависимость от площади опоры</div></div>
            </button>
            <button id="btn-liquid" class="mode-btn" onclick="setMode('liquid')">
                <span class="text-xl">💧</span>
                <div><div class="text-sm font-bold">Жидкости (Паскаль)</div><div class="text-[10px] opacity-70">Передача давления во все стороны</div></div>
            </button>
            <button id="btn-gas" class="mode-btn" onclick="setMode('gas')">
                <span class="text-xl">🎈</span>
                <div><div class="text-sm font-bold">Газы</div><div class="text-[10px] opacity-70">Давление на стенки сосуда</div></div>
            </button>
        </div>

        <!-- Dynamic Controls -->
        <div id="controls-area" class="space-y-4">
            <!-- Injected via JS based on mode -->
        </div>

        <!-- Formula Display (CSS only, no external libs) -->
        <div class="formula-box">
            <div id="formula-content" class="text-lg font-bold text-white w-full text-center">
                <!-- Content injected by JS -->
            </div>
        </div>

        <!-- Live Stats -->
        <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-slate-400 uppercase">Текущее давление</span>
                <span id="pressure-val" class="text-xl font-mono text-yellow-400 font-bold">0 Па</span>
            </div>
            <p id="mode-desc" class="text-xs text-slate-300 leading-relaxed">
                Давление твердого тела зависит от силы и площади поверхности. Чем меньше площадь, тем больше давление.
            </p>
        </div>
    </div>
</div>

<script>
    // --- State & Config ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('simContainer');
    const controlsArea = document.getElementById('controls-area');
    const formulaContent = document.getElementById('formula-content');
    const pressureVal = document.getElementById('pressure-val');
    const modeDesc = document.getElementById('mode-desc');

    // Global layout variables for mouse interaction
    let globalCx = 0;
    let globalCy = 0;

    let state = {
        mode: 'solid', // solid, liquid, gas
        time: 0,
        
        // Solid props
        mass: 10, // kg
        area: 1, // m^2
        
        // Liquid props
        depth: 2, // meters
        density: 1000, // kg/m^3
        sensorY: 0,
        
        // Gas props
        temp: 300, // Kelvin
        volume: 1, // m^3
        particles: []
    };

    // --- Initialization ---
    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        globalCx = canvas.width / 2;
        globalCy = canvas.height / 2;
        
        initParticles();
        
        // Reset sensor Y to a good starting point in the tank
        if(state.mode === 'liquid') {
            const tankTop = globalCy - 200 + 50;
            state.sensorY = tankTop + 150;
        }
    }
    window.addEventListener('resize', resize);

    function initParticles() {
        state.particles = [];
        const count = 60;
        for(let i=0; i<count; i++) {
            state.particles.push({
                x: Math.random() * 200,
                y: Math.random() * 200,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                r: 3
            });
        }
    }

    // --- UI Logic ---
    function setMode(mode) {
        state.mode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${mode}`).classList.add('active');
        
        renderControls();
        updateFormula();
        
        // Re-init specific states
        if(mode === 'liquid') {
            const tankTop = globalCy - 200 + 50;
            state.sensorY = tankTop + 150;
        }
    }

    function renderControls() {
        controlsArea.innerHTML = '';
        
        if (state.mode === 'solid') {
            controlsArea.innerHTML = `
                <div>
                    <div class="flex justify-between mb-1"><label class="text-sm font-semibold text-slate-200">Масса груза (F)</label><span id="val-mass" class="text-xs text-blue-400">${state.mass} кг</span></div>
                    <input type="range" min="1" max="50" value="${state.mass}" oninput="updateSolid('mass', this.value)">
                </div>
                <div>
                    <div class="flex justify-between mb-1"><label class="text-sm font-semibold text-slate-200">Площадь опоры (S)</label><span id="val-area" class="text-xs text-blue-400">${state.area} м²</span></div>
                    <input type="range" min="0.2" max="3" step="0.1" value="${state.area}" oninput="updateSolid('area', this.value)">
                </div>
            `;
        } else if (state.mode === 'liquid') {
            controlsArea.innerHTML = `
                <div class="text-[10px] text-slate-500 mt-2 bg-slate-800/50 p-2 rounded border border-slate-700">
                     💡 <strong>Перетаскивайте желтый датчик</strong> мышкой вверх или вниз внутри резервуара, чтобы измерить давление на разной глубине.
                </div>
            `;
        } else if (state.mode === 'gas') {
            controlsArea.innerHTML = `
                <div>
                    <div class="flex justify-between mb-1"><label class="text-sm font-semibold text-slate-200">Температура (T)</label><span id="val-temp" class="text-xs text-red-400">${state.temp} К</span></div>
                    <input type="range" min="100" max="1000" value="${state.temp}" oninput="updateGas('temp', this.value)">
                </div>
            `;
        }
    }

    // Update Handlers
    window.updateSolid = (k, v) => { state[k] = parseFloat(v); document.getElementById(`val-${k}`).innerText = v + (k==='mass'?' кг':' м²'); };
    window.updateLiquid = (k, v) => { state[k] = parseFloat(v); };
    window.updateGas = (k, v) => { state[k] = parseFloat(v); document.getElementById(`val-${k}`).innerText = v + ' К'; };

    function updateFormula() {
        let html = "";
        let desc = "";
        
        if (state.mode === 'solid') {
            html = `<span class="math-var">p</span> = <div class="math-fraction"><span class="math-num"><span class="math-var">F</span></span><span class="math-den"><span class="math-var">S</span></span></div>`;
            desc = "Давление твердого тела прямо пропорционально силе тяжести и обратно пропорционально площади опоры.";
        } else if (state.mode === 'liquid') {
            html = `<span class="math-var">p</span> = <span class="math-var">ρ</span> · <span class="math-var">g</span> · <span class="math-var">h</span>`;
            desc = "Гидростатическое давление зависит только от плотности жидкости и глубины. Оно передается во все стороны одинаково (Закон Паскаля).";
        } else if (state.mode === 'gas') {
            html = `<span class="math-var">p</span> ~ <span class="math-var">T</span>`;
            desc = "Давление газа вызвано ударами молекул о стенки. При нагревании скорость молекул растет, удары становятся чаще и сильнее.";
        }
        
        formulaContent.innerHTML = html;
        modeDesc.innerText = desc;
    }

    // --- Physics & Rendering ---
    function drawArrow(ctx, x, y, len, color, label) {
        if(Math.abs(len) < 2) return;
        const endY = y + len;
        const headSize = 6;
        
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.moveTo(x, y);
        ctx.lineTo(x, endY);
        ctx.stroke();
        
        ctx.fillStyle = color;
        ctx.beginPath();
        if (len > 0) { // Down
            ctx.moveTo(x, endY);
            ctx.lineTo(x - headSize, endY - headSize);
            ctx.lineTo(x + headSize, endY - headSize);
        } else { // Up
            ctx.moveTo(x, endY);
            ctx.lineTo(x - headSize, endY + headSize);
            ctx.lineTo(x + headSize, endY + headSize);
        }
        ctx.fill();
        
        if(label) {
            ctx.font = "bold 12px Inter";
            ctx.fillStyle = color;
            ctx.fillText(label, x+8, y+len/2);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = globalCx;
        const cy = globalCy;

        if (state.mode === 'solid') {
            // Draw Ground
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, cy + 100, canvas.width, canvas.height);
            
            // Calculate Pressure
            const F = state.mass * 9.8;
            const P = F / state.area;
            pressureVal.innerText = Math.round(P) + " Па";
            
            // Visual Size depends on Area
            const baseW = 50 + (state.area * 40); 
            const baseH = 60;
            const boxX = cx - baseW/2;
            const boxY = cy + 100 - baseH;
            
            // Draw Box
            ctx.fillStyle = '#d97706';
            ctx.fillRect(boxX, boxY, baseW, baseH);
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, baseW, baseH);
            
            // Force Arrow (Gravity)
            drawArrow(ctx, cx, boxY - 20, state.mass * 3, '#ef4444', 'F тяж');
            
            // Pressure Arrows (Underneath)
            const arrowCount = Math.max(1, Math.floor(baseW / 20));
            const arrowLen = Math.min(50, P / 100); 
            
            for(let i=0; i<arrowCount; i++) {
                const ax = boxX + (baseW/(arrowCount+1)) * (i+1);
                drawArrow(ctx, ax, cy+100, arrowLen, '#fbbf24', '');
            }

        } else if (state.mode === 'liquid') {
            // Tank dimensions
            const tankW = 300;
            const tankH = 400;
            const tankX = cx - tankW/2;
            const tankY = cy - tankH/2 + 50;
            
            // Water background
            ctx.fillStyle = 'rgba(6, 182, 212, 0.3)';
            ctx.fillRect(tankX, tankY, tankW, tankH);
            
            // Tank borders
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(tankX, tankY);
            ctx.lineTo(tankX, tankY+tankH);
            ctx.lineTo(tankX+tankW, tankY+tankH);
            ctx.lineTo(tankX+tankW, tankY);
            ctx.stroke();
            
            // Surface Line
            ctx.beginPath();
            ctx.moveTo(tankX, tankY);
            ctx.lineTo(tankX+tankW, tankY);
            ctx.strokeStyle = '#67e8f9';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Sensor Logic
            if (!state.sensorY) state.sensorY = tankY + 100;
            // Clamp sensor to tank bounds
            state.sensorY = Math.max(tankY + 15, Math.min(tankY + tankH - 15, state.sensorY));
            
            const h_pixels = state.sensorY - tankY;
            const h_meters = h_pixels / 50; // 50px = 1m scale
            
            const P = state.density * 9.8 * h_meters;
            pressureVal.innerText = Math.round(P) + " Па";
            
            // Draw Sensor
            ctx.shadowColor = 'rgba(251, 191, 36, 0.6)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(cx, state.sensorY, 14, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Inner detail of sensor
            ctx.fillStyle = '#000';
            ctx.font = "bold 11px Inter";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("P", cx, state.sensorY);
            
            // Depth Indicator Line
            ctx.strokeStyle = 'white';
            ctx.setLineDash([4,4]);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx + 35, tankY);
            ctx.lineTo(cx + 35, state.sensorY);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Depth Label background for readability
            const labelText = `h = ${h_meters.toFixed(1)} м`;
            const textWidth = ctx.measureText(labelText).width;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
            ctx.fillRect(cx + 45, (tankY + state.sensorY)/2 - 10, textWidth + 10, 20);
            
            ctx.fillStyle = 'white';
            ctx.textAlign = "left";
            ctx.fillText(labelText, cx + 50, (tankY + state.sensorY)/2 + 4);

            // Pascal Arrows (Omnidirectional pressure visualization)
            const arrLen = Math.min(60, P / 200); 
            
            // Draw arrows pointing OUT from sensor in 4 directions
            // Up
            drawArrow(ctx, cx, state.sensorY - 20, -arrLen, '#fbbf24', '');
            // Down
            drawArrow(ctx, cx, state.sensorY + 20, arrLen, '#fbbf24', '');
            // Left
            ctx.save();
            ctx.translate(cx - 20, state.sensorY);
            ctx.rotate(-Math.PI/2);
            drawArrow(ctx, 0, 0, arrLen, '#fbbf24', '');
            ctx.restore();
            // Right
            ctx.save();
            ctx.translate(cx + 20, state.sensorY);
            ctx.rotate(Math.PI/2);
            drawArrow(ctx, 0, 0, arrLen, '#fbbf24', '');
            ctx.restore();

        } else if (state.mode === 'gas') {
            // Container
            const boxS = 300;
            const bx = cx - boxS/2;
            const by = cy - boxS/2;
            
            // Background glow based on temp
            const opacity = Math.min(0.3, (state.temp - 100) / 2000);
            ctx.fillStyle = `rgba(167, 139, 250, ${opacity})`;
            ctx.fillRect(bx, by, boxS, boxS);

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 4;
            ctx.strokeRect(bx, by, boxS, boxS);
            
            // Particles physics
            const speedMult = Math.sqrt(state.temp / 300); 
            ctx.fillStyle = '#a78bfa';
            
            state.particles.forEach(p => {
                // Move
                p.x += p.vx * speedMult;
                p.y += p.vy * speedMult;
                
                // Bounce off walls
                if(p.x < bx + p.r || p.x > bx + boxS - p.r) { 
                    p.vx *= -1; 
                    p.x = Math.max(bx+p.r, Math.min(bx+boxS-p.r, p.x));
                }
                if(p.y < by + p.r || p.y > by + boxS - p.r) { 
                    p.vy *= -1; 
                    p.y = Math.max(by+p.r, Math.min(by+boxS-p.r, p.y));
                }
                
                // Draw Particle
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fill();
            });
            
            // Approximate Pressure calculation for display
            const P = (state.particles.length * state.temp * 0.8) / (boxS*boxS/10000); 
            pressureVal.innerText = Math.round(P) + " Па";
            
            // Visualizing pressure on walls
            const arrL = Math.min(40, P / 150);
            
            // Top Wall Arrow (Up)
            drawArrow(ctx, cx, by, -arrL, '#fbbf24', '');
            // Bottom Wall Arrow (Down)
            drawArrow(ctx, cx, by+boxS, arrL, '#fbbf24', '');
            // Left Wall Arrow (Left)
            ctx.save();
            ctx.translate(bx, cy);
            ctx.rotate(-Math.PI/2);
            drawArrow(ctx, 0, 0, arrL, '#fbbf24', '');
            ctx.restore();
            // Right Wall Arrow (Right)
            ctx.save();
            ctx.translate(bx+boxS, cy);
            ctx.rotate(Math.PI/2);
            drawArrow(ctx, 0, 0, arrL, '#fbbf24', '');
            ctx.restore();
        }

        requestAnimationFrame(draw);
    }

    // --- Mouse Interaction for Liquid Mode ---
    let isDraggingSensor = false;
    
    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function handleStart(e) {
        if(state.mode !== 'liquid') return;
        
        const pos = getMousePos(e);
        // Check distance to sensor (radius 14 + padding 10)
        const dist = Math.sqrt((pos.x - globalCx)**2 + (pos.y - state.sensorY)**2);
        
        if (dist < 30) {
            isDraggingSensor = true;
            canvas.classList.add('grabbing');
            if(e.cancelable) e.preventDefault();
        }
    }

    function handleMove(e) {
        if(state.mode !== 'liquid') {
            // Change cursor if hovering over sensor
            const pos = getMousePos(e);
            const dist = Math.sqrt((pos.x - globalCx)**2 + (pos.y - state.sensorY)**2);
            if (dist < 30) canvas.classList.add('pointer');
            else canvas.classList.remove('pointer');
            return;
        }

        if(isDraggingSensor) {
            const pos = getMousePos(e);
            
            // Constrain Y movement to tank bounds
            const tankTop = globalCy - 200 + 50;
            const tankBot = tankTop + 400;
            
            if(pos.y > tankTop && pos.y < tankBot) {
                state.sensorY = pos.y;
            }
            if(e.cancelable) e.preventDefault();
        }
    }

    function handleEnd() {
        isDraggingSensor = false;
        canvas.classList.remove('grabbing');
    }

    // Event Listeners
    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

    // Start
    setTimeout(() => {
        resize();
        setMode('solid');
        draw();
    }, 100);

</script>
</body>
</html>
